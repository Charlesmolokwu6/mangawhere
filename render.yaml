services:
  - type: web
    name: mangawhere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Render's Python build and runtime steps don't share ~/.cache, so a
      # browser installed there (Playwright's default) is gone by the time
      # the app actually runs. This makes `playwright install` put it
      # inside the installed playwright package itself instead, which
      # *is* carried over — and the app needs the same value at runtime
      # so it looks in the same place.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "1800"
      # Optional — profile picture uploads (see README.md). Leaving these
      # unset is fine; avatars just stay the default initials circle.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional — makes the video-link title lookup's audio transcription
      # (see README.md) far less likely to hit YouTube's bot-check. Leaving
      # it unset is fine; that lookup just falls back to the paste-caption
      # box more often.
      - key: YOUTUBE_COOKIES
        sync: false
      # Strongly recommended (see README.md) — without these, accounts,
      # watch lists, and comments all live in data/, which Render's free
      # plan wipes on every redeploy. Set both to move that storage to a
      # real (free-tier) Turso database instead; leaving them unset keeps
      # today's behavior exactly as it is.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional (see README.md) — the *secret* key for Cloudflare Turnstile,
      # which replaces the sign-up form's custom captcha with Cloudflare's
      # bot-detection widget once both this and index.html's public site key
      # are set. Leaving it unset keeps the custom captcha exactly as it is.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Optional (see README.md) — "Sign in with Google" / "Sign in with
      # Facebook". GOOGLE_CLIENT_ID and FACEBOOK_APP_ID are public (they
      # also live in index.html, hardcoded, same as the Turnstile site
      # key) — set here too because the backend needs the same values to
      # verify a sign-in actually belongs to this app. FACEBOOK_APP_SECRET
      # is the one that's private. Leaving any of these unset just leaves
      # that provider's button not rendering — email/password and whatever
      # other providers are configured are unaffected.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # Optional (see README.md) — the AI storyteller for chapter narration.
      # Ollama can't run on the free plan itself (it needs GBs of RAM), so
      # this points at one running elsewhere. Left unset, narration reads
      # the dialogue aloud without the AI rewrite.
      - key: OLLAMA_HOST
        sync: false
      - key: NARRATION_MODEL
        sync: false
