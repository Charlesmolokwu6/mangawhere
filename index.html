/* ---- auth ----
   The token is the session. Kept in the same storage as the list so both
   survive a reload, and sent as a bearer header on anything account-shaped. */
var auth = { token:null, email:null, name:null };

function loadAuth(){
  try{
    var raw=store.get("mw.auth");
    if(raw) auth=JSON.parse(raw);
  }catch(e){ auth={token:null,email:null,name:null}; }
  return auth;
}
function saveAuth(a){
  auth=a||{token:null,email:null,name:null};
  if(auth.token) store.set("mw.auth", JSON.stringify(auth));
  else store.set("mw.auth","");
}
function signedIn(){ return !!(auth && auth.token); }

/* Every account-scoped call goes through here so the token is never
   forgotten and a dead session logs out cleanly instead of failing oddly. */
function api(path, opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  opts.headers["Content-Type"]="application/json";
  if(auth.token) opts.headers["Authorization"]="Bearer "+auth.token;
  return fetch(API_BASE+path, opts).then(function(r){
    if(r.status===401 && auth.token){ saveAuth(null); }
    return r.json();
  });
}

function authView(mode, thenTrack){
  stopRail();
  var login = mode==="login";
  var view=document.getElementById("app");
  view.innerHTML=
    '<button class="back" id="abk">← Back</button>'+
    '<h1>'+(login?"Welcome back":"Create your account")+'</h1>'+
    '<p class="sub">'+(login
      ? "Sign in to get to your list."
      : "So your list is yours — on any device, and still there if you lose this one.")+
    '</p>'+
    (thenTrack?'<div class="note"><p><strong>Nearly there</strong>'+
      'Sign up and we\'ll start tracking '+esc(thenTrack.title)+' straight away.</p></div>':"")+
    '<div class="form">'+
      '<label>Email<input id="au-email" type="email" autocomplete="email" '+
        'inputmode="email" placeholder="you@example.com"></label>'+
      '<label>Password<input id="au-pass" type="password" '+
        'autocomplete="'+(login?"current-password":"new-password")+'" '+
        'placeholder="'+(login?"Your password":"At least 8 characters")+'"></label>'+
      '<button class="primary" id="au-go">'+(login?"Sign in":"Create account")+'</button>'+
      '<p class="err" id="au-err"></p>'+
    '</div>'+
    '<p class="hint swap">'+(login
      ? 'New here? <button class="linkish" id="au-swap">Create an account</button>'
      : 'Already have one? <button class="linkish" id="au-swap">Sign in</button>')+'</p>';

  document.getElementById("abk").onclick=function(){ setTab("home"); };
  document.getElementById("au-swap").onclick=function(){
    authView(login?"signup":"login", thenTrack);
  };

  var go=document.getElementById("au-go");
  var err=document.getElementById("au-err");

  function submit(){
    var email=document.getElementById("au-email").value.trim();
    var pass=document.getElementById("au-pass").value;
    if(!email || !pass){ err.textContent="Fill in both fields."; return; }
    if(!login && pass.length<8){
      err.textContent="Password must be at least 8 characters."; return;
    }
    go.disabled=true; go.textContent=login?"Signing in…":"Creating…";
    err.textContent="";

    api(login?"/api/login":"/api/register",{
      method:"POST",
      body:JSON.stringify({email:email, password:pass,
        endpoint:pushState.endpoint||undefined})
    }).then(function(d){
      if(d.error){
        err.textContent=d.error;
        go.disabled=false; go.textContent=login?"Sign in":"Create account";
        return;
      }
      saveAuth({token:d.token, email:d.email, name:d.name, code:d.code});
      return pullServerList().then(function(){
        // We told them we'd start tracking it, so do that — don't make
        // them tap the same button twice.
        if(thenTrack){
          if(!inList(thenTrack.id)){
            addToList(thenTrack, thenTrack.chapters||null);
            syncWatch(thenTrack, thenTrack.chapters||null);
          }
          updateBadge();
          showDetail(thenTrack, null);
        } else {
          setTab("list");
        }
      });
    }).catch(function(e){
      err.textContent="Couldn't reach the server — "+e.message;
      go.disabled=false; go.textContent=login?"Sign in":"Create account";
    });
  }

  go.onclick=submit;
  ["au-email","au-pass"].forEach(function(id){
    document.getElementById(id).onkeydown=function(e){
      if(e.key==="Enter") submit();
    };
  });
  window.scrollTo(0,0);
}

/* After linking, the server knows about titles this browser doesn't. */
function pullServerList(){
  if(!API_BASE || !pushState.endpoint) return Promise.resolve();
  return fetch(API_BASE+"/api/list?endpoint="+encodeURIComponent(pushState.endpoint))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var local=getList();
      var have={};
      local.forEach(function(x){ have[String(x.id)]=true; });
      (d.titles||[]).forEach(function(t){
        if(have[String(t.key)]) return;
        local.push({id:t.key, title:t.name, cover:t.cover||"", kind:t.kind||"",
          status:"", country:"", links:[], seen:t.seen, latest:t.latest,
          added:Date.now()});
      });
      saveList(local);
    })
    .catch(function(){});
}

function wireListRows(){

        b.onclick=function(e){

        };

        if(item) showDetail(item, null);
      };

  }
}

/* This is the monitoring. No server involved — every time you open the
   list we re-check each title and compare against the number you last
   saw. Real push notifications need the backend; this needs nothing. */
function refreshList(l){
  l.forEach(function(x,i){
    latestFor(x).then(function(n){
      if(!n) return;
      var cur=getList();
      var changed=false;
      cur.forEach(function(y){
        if(String(y.id)===String(x.id) && y.latest!==n){ y.latest=n; changed=true; }
      });
      if(changed) saveList(cur);
      var el=document.getElementById("lm-"+i);
      if(el){
        var item=cur.filter(function(y){ return String(y.id)===String(x.id); })[0]||{};
        var diff=(item.seen&&item.latest&&item.latest>item.seen)?(item.latest-item.seen):0;
        el.innerHTML="chapter "+n+(diff?' · <span class="newtag">'+diff+' new</span>':"");
        if(diff){
          var row=el.closest(".lrow");
          if(row && !row.classList.contains("unread")){ row.classList.add("unread"); }
        }
      }
      updateBadge();
    });
  });
}

/* One number, best source first: the publisher if we can read it,
   otherwise the release tracker. */
function latestFor(x){
  return webtoonLatest(x.links).then(function(pub){
    if(pub && pub.chapter) return pub.chapter;
    return muLatest(x.title).then(function(hit){
      return (hit && hit.chapter) ? hit.chapter : null;
    });
  }).catch(function(){ return null; });
}

/* ---- install prompt ----
   Chrome fires beforeinstallprompt when the app qualifies; we hold onto it
   and show our own bar instead, because the browser's default is easy to
   miss. iOS never fires it — Apple requires Share > Add to Home Screen by
   hand — so those users get told that instead. */
var deferredInstall=null;

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall=e;
  if(!store.get("mw.noinstall")) showInstallBar(false);
});

function showInstallBar(iosMode){
  var bar=document.getElementById("installbar");
  if(!bar || isStandalone()) return;
  if(iosMode){
    bar.querySelector("span").textContent="Tap Share, then Add to Home Screen";
    document.getElementById("installgo").hidden=true;
  }
  bar.hidden=false;
}

document.getElementById("installgo").onclick=function(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(function(){
    deferredInstall=null;
    document.getElementById("installbar").hidden=true;
  });
};
document.getElementById("installno").onclick=function(){
  document.getElementById("installbar").hidden=true;
  store.set("mw.noinstall","1");   // asked once, that's enough
};

// iOS gets the manual instruction, and it matters more there: Apple only
// allows push notifications once the app is on the home screen.
if(isIOS() && !isStandalone() && !store.get("mw.noinstall")){
  setTimeout(function(){ showInstallBar(true); }, 3000);
}
document.getElementById("home").onclick=function(){homeView();};
loadAuth();
homeView();
updateBadge();
</script>
</body>
</html>
