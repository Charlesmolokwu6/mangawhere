# Render's free plan puts the backend to sleep after 15 minutes without
# a request; the next visitor then waits about a minute, and the new-chapter
# poller stops while it's asleep. Pinging a cheap endpoint keeps it awake.
# GitHub can start scheduled runs late, so this runs every 5 minutes to stay
# well inside the 15. Free for a public repo; one always-on service fits in
# Render's 750 free hours a month.
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        run: >-
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null
          -w "HTTP %{http_code} in %{time_total}s\n"
          https://mangawhere.onrender.com/api/config
