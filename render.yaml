services:
  - type: web
    name: mangawhere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Render's Python build and runtime steps don't share ~/.cache, so a
      # browser installed there (Playwright's default) is gone by the time
      # the app actually runs. This makes `playwright install` put it
      # inside the installed playwright package itself instead, which
      # *is* carried over — and the app needs the same value at runtime
      # so it looks in the same place.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "1800"
      # Optional — profile picture uploads (see README.md). Leaving these
      # unset is fine; avatars just stay the default initials circle.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional — makes the video-link title lookup's audio transcription
      # (see README.md) far less likely to hit YouTube's bot-check. Leaving
      # it unset is fine; that lookup just falls back to the paste-caption
      # box more often.
      - key: YOUTUBE_COOKIES
        sync: false
      # Strongly recommended (see README.md) — without these, accounts,
      # watch lists, and comments all live in data/, which Render's free
      # plan wipes on every redeploy. Set both to move that storage to a
      # real (free-tier) Turso database instead; leaving them unset keeps
      # today's behavior exactly as it is.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
