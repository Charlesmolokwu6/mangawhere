<html lang="en">
<head>

<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#14101a;--surf:#1e1826;--surf2:#271f31;--line:#372c44;--text:#f0ebf5;
--dim:#a094ad;--mint:#3fe0c8;--mintd:#0e3a34;--warn:#ffb454;--bad:#ff6b6b}
*{box-sizing:border-box}
/* A class that sets `display` beats the browser's built-in [hidden] rule,
   so `el.hidden = true` silently does nothing on any flex or grid element.
   This makes the attribute mean what everyone assumes it means. */
[hidden]{display:none!important}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
img{display:block;max-width:100%}button{font-family:inherit;cursor:pointer}
.mono{font-family:ui-monospace,Consolas,monospace}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;
transition:transform .25s ease}
/* Scoped to the reader (body.reading) only — the chrome never auto-hides
   anywhere else in the app. */
body.reading.chrome-hidden .top{transform:translateY(-100%)}
body.reading.chrome-hidden .tabs{transform:translateY(100%)}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em;background:none;border:none;color:var(--text);padding:0}
.logo b{color:var(--mint)}
.acct{text-align:center}
.acct h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
margin:0 0 10px;font-weight:600}
.code{font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;
letter-spacing:.14em;color:var(--mint)}
.acct .t{font-size:12px;color:var(--dim);margin:10px 0 0}
.acstat{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);
display:flex;align-items:baseline;gap:9px}
.acstat .v{font-size:27px;font-weight:700;color:var(--mint);
font-family:ui-monospace,Consolas,monospace}
.acstat .k{font-size:13px;color:var(--dim)}
.notifrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.nleft{flex:1;min-width:0}
.notifrow h4{margin:0;font-size:14px;font-weight:600;color:var(--text);
text-transform:none;letter-spacing:0}
.notifrow .t{margin:3px 0 0;font-size:12px;color:var(--dim)}
.nbtn{background:var(--mint);color:#0d2b26;border:none;border-radius:9px;
padding:9px 15px;font-size:13px;font-weight:700;flex-shrink:0}
.nbtn:disabled{opacity:.6}
.oauth-buttons{display:flex;flex-direction:column;gap:10px;max-width:400px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;
background:var(--surf);border:1px solid var(--line);border-radius:10px;
padding:12px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.oauth-btn:hover{border-color:var(--mint)}
.oauth-btn:disabled{opacity:.6;cursor:default}
.oauth-divider{display:flex;align-items:center;gap:10px;max-width:400px;
margin:14px 0;color:var(--dim);font-size:12px}
.oauth-divider:before,.oauth-divider:after{content:"";flex:1;height:1px;background:var(--line)}
.form{display:flex;flex-direction:column;gap:13px;max-width:400px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;
color:var(--dim);font-weight:600}
.form input{background:var(--surf);border:1px solid var(--line);border-radius:10px;
padding:13px;color:var(--text);font-size:16px;font-family:inherit}
.form input:focus{outline:none;border-color:var(--mint)}
.primary{background:var(--mint);color:#0d2b26;border:none;border-radius:10px;
padding:14px;font-weight:700;font-size:15px;margin-top:4px}
.primary:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;margin:0;min-height:18px}
.linkish{background:none;border:none;color:var(--mint);font-weight:600;
font-size:inherit;padding:0;text-decoration:underline;cursor:pointer}
.swap{margin-top:16px}
.forgot{margin:2px 0 0;text-align:right;font-size:14px}
.pitch{max-width:420px;margin:22px auto 0;text-align:center}
.pitch h1{font-size:23px;margin:0 0 8px}
.pitch .sub{margin:0 0 20px}
.picon{width:58px;height:58px;border-radius:50%;background:var(--mintd);
color:var(--mint);font-size:24px;display:flex;align-items:center;
justify-content:center;margin:0 auto 18px}
.pben{list-style:none;padding:0;margin:0 0 24px;text-align:left;
display:flex;flex-direction:column;gap:11px}
.pben li{position:relative;padding-left:26px;font-size:14px;color:var(--text)}
.pben li:before{content:"✓";position:absolute;left:0;top:0;color:var(--mint);
font-weight:700}
.pitch .primary{width:100%}
.pitch .hint{margin-top:14px}
/* Off-screen rather than display:none — some bots skip hidden fields but
   still fill ones that are merely out of view. */
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.cap{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.capimg{flex:1;min-height:74px;display:flex;align-items:center;
justify-content:center;background:#1b1830;border:1px solid var(--line);
border-radius:10px;overflow:hidden}
.capimg svg{display:block;max-width:100%;height:auto}
.caploading{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.caprefresh{background:var(--surf);border:1px solid var(--line);color:var(--dim);
border-radius:9px;width:40px;height:40px;font-size:17px;cursor:pointer;flex-shrink:0}
.caprefresh:hover{border-color:var(--mint);color:var(--mint)}
.pwwrap{position:relative;display:flex}
.pwwrap input{flex:1;padding-right:44px}
.pwtoggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);
background:none;border:none;color:var(--dim);cursor:pointer;
display:flex;align-items:center;justify-content:center;padding:8px}
.pwtoggle:hover{color:var(--mint)}
#au-cap{text-transform:uppercase;letter-spacing:.22em;font-family:ui-monospace,Consolas,monospace}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--mintd);
color:var(--mint);display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:18px;flex-shrink:0}
.whoin h4{margin:0;font-size:15px;font-weight:600;color:var(--text);
text-transform:none;letter-spacing:0}
.whoin p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.danger{background:none;border:1px solid var(--line);color:var(--dim);
border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;width:100%;
margin-top:14px}
.danger:hover{border-color:var(--bad);color:var(--bad)}
.badge{background:var(--mint);color:#0d2b26;border-radius:20px;padding:1px 7px;
font-size:11px;font-weight:700;display:none}
.badge.on{display:inline-block}
/* ---- app shell ---- */
/* env(safe-area-inset-*) keeps content clear of the notch and the iOS home
   indicator. Without it the bottom tabs sit under the gesture bar and get
   half-tapped. */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
background:rgba(18,16,28,.96);backdrop-filter:blur(12px);
border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom,0);transition:transform .25s ease}
.tab{flex:1;background:none;border:none;color:var(--dim);cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:3px;
padding:9px 0 7px;font-size:10px;font-weight:600;position:relative;
-webkit-tap-highlight-color:transparent}
.tab .ti{font-size:19px;line-height:1}
.tab .tl{letter-spacing:.02em}
.tab.on{color:var(--mint)}
.tab:active{opacity:.6}
.tbadge{position:absolute;top:4px;right:50%;margin-right:-22px;
background:var(--mint);color:#0d2b26;font-size:9px;font-weight:700;
border-radius:20px;padding:1px 5px;display:none}
.tbadge.on{display:block}

/* Room for the bar, so the last row of content isn't hidden behind it. */
main{padding-bottom:calc(78px + env(safe-area-inset-bottom,0))}

.installbar{position:fixed;left:12px;right:12px;
bottom:calc(72px + env(safe-area-inset-bottom,0));z-index:45;
background:var(--surf2);border:1px solid var(--mint);border-radius:12px;
padding:11px 12px;display:flex;align-items:center;gap:10px;
font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.installbar span{flex:1}
.installbar button{background:var(--mint);color:#0d2b26;border:none;
border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700}
.installbar .x{background:none;color:var(--dim);font-size:19px;padding:0 4px}

/* Installed, the browser chrome is gone, so the header takes over the
   status bar area. */
@media (display-mode: standalone){
  .top{padding-top:calc(10px + env(safe-area-inset-top,0))}
}

.diag{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;text-align:right}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(20px,5.5vw,27px);font-weight:700;letter-spacing:-.03em;margin:0 0 6px;line-height:1.15}
.sub{color:var(--dim);font-size:14px;margin:0 0 18px}
.paste{display:flex;gap:8px;margin-bottom:8px}
.paste input{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line);
color:var(--text);border-radius:11px;padding:14px;font-size:15px;font-family:inherit}
.paste input:focus{outline:none;border-color:var(--mint)}
.paste input::placeholder{color:#6d6178}
.paste button{background:var(--mint);color:#0d2b26;border:none;border-radius:11px;
padding:0 20px;font-weight:700;font-size:14px}
.paste button:disabled{opacity:.45}
.searchwrap{position:relative;z-index:30}
.suggest{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--surf);
border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.55);
max-height:340px;overflow-y:auto}
.sug{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
padding:9px 12px;text-align:left;color:inherit;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:none}
.sug:hover,.sug.on{background:var(--surf2)}
.sug img,.sug .sph{width:34px;height:48px;object-fit:cover;border-radius:5px;
flex-shrink:0;background:var(--surf2);display:block}
.sinfo{min-width:0;display:flex;flex-direction:column}
.st{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{color:var(--mint)}
.sm{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:11px;color:var(--dim);margin:0 0 24px;font-family:ui-monospace,Consolas,monospace}
h3{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:26px 0 12px}
/* Horizontal rail. Native scroll + scroll-snap so touch, trackpad and
   momentum all behave the way the OS does them — a JS transform carousel
   fights the platform and feels wrong on a phone. */
/* Explicit pixel sizes throughout. aspect-ratio inside a flex <button>
   is where this broke once already, and a carousel that renders as an
   empty strip is worse than a plain grid. */
.railwrap{position:relative}
/* Native horizontal scroll, driven forward by JS rather than a CSS
   transform. A transform can't be scrolled back — if a cover drifts past
   you there's no way to reach it — whereas this stays a real scroller you
   can swipe, drag, or nudge with the arrows.

   The catch scrollLeft brings is that it only takes whole pixels, so a
   22px/sec drift of ~0.37px per frame rounds to zero and never moves. The
   loop below banks the fraction and spends it once it reaches a pixel. */
.rail{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.track{display:flex;align-items:flex-start;gap:12px;width:max-content;
padding:2px 0 10px}
.railwrap+.railwrap{margin-top:14px}
.tile{background:none;border:none;padding:0;text-align:left;color:inherit;
width:132px;min-width:132px;flex:0 0 132px}

/* Arrows. Hidden from screen readers because the rail itself is already
   reachable and scrollable by keyboard. */
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
background:rgba(18,16,28,.92);color:var(--text);font-size:16px;line-height:1;
display:flex;align-items:center;justify-content:center;cursor:pointer;
opacity:0;transition:opacity .18s;backdrop-filter:blur(4px)}
.railwrap:hover .arrow,.arrow:focus-visible{opacity:1}
.arrow:hover{border-color:var(--mint);color:var(--mint)}
.arrow.l{left:-4px}
.arrow.r{right:-4px}
/* On touch there's no hover, and swiping is the natural gesture — but the
   arrows still help anyone who doesn't think to try. */
@media(hover:none){.arrow{opacity:.85}}


/* Automatic fallback: if the marquee can't lay out, this turns it back
   into the grid that was already working. */
.rail.grid{overflow:visible}
.rail.grid .track{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
gap:16px 12px;width:auto}
.rail.grid+.arrow,.rail.grid~.arrow{display:none}
.rail.grid .tile{width:100%;min-width:0}
@media(hover:none){}
.dots{display:flex;gap:5px;justify-content:center;margin-top:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--mint)}
.tile img,.tile .ph,.tile .skel{display:block;width:132px;height:198px;
object-fit:cover;border-radius:9px;background:var(--surf2);transition:transform .13s}

.rail.grid .tile img,.rail.grid .tile .ph,.rail.grid .tile .skel{width:100%;height:auto;aspect-ratio:2/3}
.tile:hover img{transform:translateY(-3px)}
.tile h4{font-size:12px;font-weight:600;margin:7px 0 1px;line-height:1.3;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{font-size:10px;color:var(--dim);margin:0;font-family:ui-monospace,Consolas,monospace}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.hit{display:flex;gap:14px}
.hit img,.hit .ph{width:86px;height:126px;object-fit:cover;border-radius:9px;flex-shrink:0;background:var(--surf2)}
.hit h2{font-size:18px;font-weight:700;margin:0 0 4px;line-height:1.2}
.hit .meta{font-size:11px;color:var(--dim);margin:0;font-family:ui-monospace,Consolas,monospace}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:8px;
font-family:ui-monospace,Consolas,monospace;background:#2b2438;color:var(--dim)}
.pill.on{background:var(--mintd);color:var(--mint)}
.boxes{display:flex;gap:8px;margin-top:13px}
.boxes div{flex:1;background:var(--surf2);border-radius:9px;padding:9px 11px}
.boxes .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;
font-family:ui-monospace,Consolas,monospace}
.boxes .v{font-size:17px;font-weight:700;margin-top:1px}

.behind{color:var(--mint);font-size:12px;margin-top:10px;font-weight:600}
.verdict{font-size:13px;margin:12px 0 0;padding:9px 12px;border-radius:9px;line-height:1.45}
.verdict.done{background:#2a2340;color:#c4b5ff}
.verdict.live{background:var(--mintd);color:var(--mint)}
.verdict.warn{background:#3a2d1a;color:var(--warn)}
.fresh.stale{color:var(--warn)}
.fresh.authoritative{color:var(--mint)}
.seasontag{font-size:11px;background:var(--surf);color:var(--mint);padding:2px 6px;
border-radius:5px;margin-right:6px;vertical-align:middle;font-family:ui-monospace,Consolas,monospace}
.sharebtn{width:100%;margin-top:12px;background:var(--surf2);color:var(--text);
border:1px solid var(--line);border-radius:11px;padding:12px;font-weight:600;
font-size:14px;cursor:pointer}
.sharebtn:hover{border-color:var(--mint);color:var(--mint)}
/* Storyteller (chapter narration) — floats above the bottom tabs, reader only. */
.narr{position:fixed;right:16px;bottom:76px;z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
max-width:calc(100vw - 32px)}
.narr-fab{background:var(--mint);color:#0d2b26;border:none;border-radius:999px;padding:11px 16px;
font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.narr-panel{width:300px;max-width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:14px;
padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px}
.narr-panel h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.narr-panel h4 button{background:none;border:none;color:var(--dim);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.narr-panel .sub{margin:0 0 10px;color:var(--dim);font-size:12.5px}
.narr-panel select,.narr-panel .go{width:100%;border-radius:10px;padding:10px;font:inherit;font-size:14px}
.narr-panel select{background:var(--surf);color:var(--text);border:1px solid var(--line);margin-bottom:8px}
.narr-panel .go{background:var(--mint);color:#0d2b26;border:none;font-weight:700;cursor:pointer}
.narr-bar{height:6px;background:var(--surf);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.narr-bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
.narr-panel audio{width:100%;margin-top:8px}
.narr-panel .err{color:var(--bad);margin:6px 0 0}
.narr-row{display:flex;gap:8px}
/* Phone storyteller player: one round button, plus settings and stop. */
.narr-btns{display:flex;align-items:center;gap:10px}
.narr-play{width:58px;height:58px;border-radius:50%;border:none;background:var(--mint);color:#0d2b26;
display:grid;place-items:center;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:0}
.narr-play svg,.narr-mini svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.narr-play svg{width:27px;height:27px}
.narr-play svg .fill{fill:currentColor;stroke:none}
.narr-play[data-state="loading"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;
border:3px solid transparent;border-top-color:var(--mint);border-right-color:var(--mint);animation:narrspin .9s linear infinite}
.narr-play[data-state="playing"]{animation:narrpulse 1.6s ease-out infinite}
@keyframes narrspin{to{transform:rotate(360deg)}}
@keyframes narrpulse{0%{box-shadow:0 0 0 0 rgba(63,224,200,.55),0 6px 18px rgba(0,0,0,.35)}
100%{box-shadow:0 0 0 16px rgba(63,224,200,0),0 6px 18px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion: reduce){.narr-play[data-state]{animation:none}.narr-play::after{animation:none}}
.narr-mini{width:42px;height:42px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);
color:var(--text);display:grid;place-items:center;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.narr-mini svg{width:19px;height:19px}
.narr-cap{width:min(300px,calc(100vw - 32px));background:var(--surf2);border:1px solid var(--line);border-radius:12px;
padding:8px 12px;font-size:13.5px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.narr-cap small{display:block;color:var(--dim);font-size:11px;margin-bottom:2px}
.narr-cap span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.narr-sheet{width:min(300px,calc(100vw - 32px));background:var(--surf2);border:1px solid var(--line);border-radius:14px;
padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.narr-sheet h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.narr-sheet h4 button{background:none;border:none;color:var(--dim);font-size:20px;line-height:1;padding:0 2px}
.narr-sheet select{width:100%;border-radius:10px;padding:10px;font:inherit;font-size:14px;margin-bottom:8px;
background:var(--surf);color:var(--text);border:1px solid var(--line)}
.narr-sheet .sub{margin:2px 0 0;color:var(--dim);font-size:12px}
.narr-topad{position:fixed;left:0;right:0;top:0;z-index:19;display:flex;justify-content:center;
background:var(--bg);padding:4px 0;border-bottom:1px solid var(--line);transition:top .25s ease}
.narr-topad .adslot{margin:0}
.narr-row select{flex:1;min-width:0}
.narr-ctl{display:flex;gap:8px;margin-top:8px}

<script>
/* ================= proxy =================
   MangaUpdates and TikTok refuse browser requests (no CORS headers), and
   they hold the two pieces of data this product is built on: the current
   chapter, and the video's caption. A tiny proxy fixes both — main.py
   itself implements it (any "?url=" on its root).

   This is hardcoded to the deployed backend rather than defaulting to
   same-origin, because the frontend (this file, on GitHub Pages) and the
   backend (main.py, on Render) are two different origins — there's no
   same-origin default that would reach it.

   Override it either way:
     - edit PROXY below, or
     - open the page with ?proxy=https://yours.workers.dev (handy for
       pointing a local index.html at a local `uvicorn main:app` instead)
   Leave it empty and the app still runs — it just can't show chapter
   counts for ongoing series.                                            */
var PROXY = "https://mangawhere.onrender.com";

/* Adult titles. Off means everything shows, which is how AniList and
   MyAnimeList work too. Flip to true if you ever need to hide them —
   ad networks and the app stores have their own rules about this, so
   it's worth being able to switch without a rewrite. */
var HIDE_ADULT = false;

/* Amazon Associates tag. Sign up at affiliate-program.amazon.com, paste
   your tag here, and the buy links start earning. Left empty the links
   simply don't appear rather than sending untagged traffic. */
var AMAZON_TAG = "";

/* Ads. Each place below holds either an ad unit on AD_HOST (a size such as
   "300x250", the units listed in adhost/ad.html) or a network's raw
   HTML/script snippet, or a list of those to show together, one under
   the other. Leave a place "" and nothing shows there.
     homeTop   - home page, at the very top above the headline
     home      - home page, below Trending
     detailChapters - a title's page, just above its chapter list
     detail    - a title's page, below its chapter list
     readerTop - top of a chapter, above Back and the chapter picker
     narration - pinned to the top of the screen while storyteller mode reads
     readerPages - between a chapter's pages, after every AD_EVERY_PAGES pages
     readerEnd - end of a chapter, just above Prev / Next
   AD_HOST is adhost/ad.html deployed as its own Render static site. Being a
   different origin from this page, its ad code gets working cookies (which
   Adsterra's script needs) yet can't read this page, its storage or anyone's
   sign-in. A raw snippet instead runs in a sandboxed srcdoc frame; for that,
   write each closing script tag in it with a backslash: "<\/script>". */
var AD_HOST = "https://mangawhere-ads.onrender.com/ad.html";
/* Rotate a hosted ad to a fresh one after this many seconds ON SCREEN
   (at least half the frame visible, tab in front); time scrolled away or
   in the background doesn't count. 0 = off. Adsterra confirmed refresh is
   allowed with a minimum of 10 seconds; never set it below that. */
var AD_REFRESH_SECONDS = 25;
var ADS = {
  homeTop: "320x50",
  home: "300x250",
  detailChapters: "320x50",
  detail: "300x250",
  readerTop: "320x50",
  narration: "320x50",   // pinned to the top of the screen while storyteller mode reads
  readerPages: ["320x50", "320x50"],   // two thin strips together between pages
  readerEnd: "320x50"
};
var AD_EVERY_PAGES = 4;
var AD_NATIVE_HEIGHT = 300;
var AD_SLOT_HTML = "";  // older single slot; used for `detail` if that's empty

/* Cloudflare Turnstile — a free, privacy-friendly CAPTCHA replacement for
   the sign-up form's bot check. This is the *site key*, which is public
   and safe to hardcode here (unlike its matching secret key, which stays
   server-side as Render's TURNSTILE_SECRET_KEY — see README.md). Left
   empty, sign-up keeps using the custom SVG captcha exactly as it always
   has; setting this one value is what switches it over.
   Get one at dash.cloudflare.com → Turnstile → Add widget. */
var TURNSTILE_SITE_KEY = "0x4AAAAAAFEw1ZFC95QtMxrP";
(function(){
  if(!TURNSTILE_SITE_KEY) return;
  var s=document.createElement("script");
  s.src="https://challenges.cloudflare.com/turnstile/v0/api.js";
  s.async=true; s.defer=true;
  document.head.appendChild(s);
})();

/* "Continue with Google" / "Continue with Facebook" — both hand the
   frontend a token directly (no redirect dance), which gets verified
   server-side (server/oauth.py) before a session is issued. These IDs are
   public — safe to hardcode here, same as the Turnstile site key above;
   what actually needs protecting (Facebook's app secret) never leaves
   Render's environment variables. Left empty, that provider's button
   just doesn't render — email/password sign-up is unaffected either way.
   Google: console.cloud.google.com → APIs & Services → Credentials →
     Create OAuth client ID (type: Web application) → add this site's
     origin(s) under "Authorized JavaScript origins".
   Facebook: developers.facebook.com → Create App → add the "Facebook
     Login" product → App Settings → add this site's domain under
     App Domains. */
var GOOGLE_CLIENT_ID = "";
var FACEBOOK_APP_ID = "";
(function(){
  if(GOOGLE_CLIENT_ID){
    var s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.async=true; s.defer=true;
    document.head.appendChild(s);
  }
  if(FACEBOOK_APP_ID){
    var s2=document.createElement("script");
    s2.src="https://connect.facebook.net/en_US/sdk.js";
    s2.async=true; s2.defer=true;
    s2.onload=function(){
      if(typeof FB!=="undefined") FB.init({appId:FACEBOOK_APP_ID, cookie:false, xfbml:false, version:"v19.0"});
    };
    document.head.appendChild(s2);
  }
})();
(function(){
  var q=new URLSearchParams(location.search).get("proxy");
  if(q) PROXY=q.replace(/\/$/,"");
})();
function via(url){
  return PROXY ? PROXY+"/?url="+encodeURIComponent(url) : url;
}

/* ================= notifications =================
   Set API_BASE to your deployed backend and the Track button starts
   registering for real push notifications instead of only saving
   locally. Leave it empty and everything still works — the list just
   stays on this device.

   Push needs HTTPS. Opening this file from your computer will never
   work; that's a browser rule, not a bug.                              */
// Hardcoded for the same reason as PROXY above: this file is served from
// GitHub Pages, main.py runs on Render — different origins, so there's no
// same-origin default that reaches it. Override with ?api=... (e.g. to
// point a local index.html at a local `uvicorn main:app`).
var API_BASE = "https://mangawhere.onrender.com";
(function(){
  var q=new URLSearchParams(location.search).get("api");
  if(q) API_BASE=q.replace(/\/$/,"");
})();

// The reader (/api/scrape, /api/series, /api/find) lives on the same
// backend as everything else (main.py), so this just follows API_BASE by
// default. Kept as its own variable rather than used directly, so an
// unusual setup that splits the reader onto a different host still can,
// via "?reader=", without that becoming the default everyone else hits.
var READER_BASE = API_BASE;
(function(){
  var q=new URLSearchParams(location.search).get("reader");
  if(q) READER_BASE=q.replace(/\/$/,"");
})();

var pushState={ supported:false, subscribed:false, endpoint:null, reason:"" };

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
}
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.navigator.standalone===true;
}

function pushSupport(){
  if(!API_BASE) return {ok:false, reason:"no backend configured"};
  if(location.protocol!=="https:" && location.hostname!=="localhost")
    return {ok:false, reason:"notifications need https — deploy the site first"};
  if(!("serviceWorker" in navigator) || !("PushManager" in window))
    return {ok:false, reason:"this browser doesn't support notifications"};
  // Apple only allows web push once the site is on the home screen.
  if(isIOS() && !isStandalone())
    return {ok:false, reason:"ios:add-to-home-screen"};
  return {ok:true};
}

function urlB64ToUint8Array(base64){
  var padding="=".repeat((4-base64.length%4)%4);
  var raw=atob((base64+padding).replace(/-/g,"+").replace(/_/g,"/"));
  var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}

/* Registers the device once, then reuses it. Safe to call repeatedly.

   Order matters more than it looks. Chrome only honours a permission
   request that is still connected to the tap that triggered it, and any
   await in between breaks that connection — the prompt silently never
   appears and you get back "default". So we ask first, and do the
   service worker registration afterwards. */
function enablePush(){
  var sup=pushSupport();
  if(!sup.ok) return Promise.resolve({ok:false, reason:sup.reason});

  if(Notification.permission==="denied")
    return Promise.resolve({ok:false, reason:"blocked"});

  var ask;
  try{
    ask=Notification.requestPermission();     // must be the first thing
  }catch(e){
    return Promise.resolve({ok:false, reason:"permission request failed"});
  }
  // Older Safari passes the result to a callback instead of a promise.
  if(!ask || typeof ask.then!=="function"){
    ask=new Promise(function(res){ Notification.requestPermission(res); });
  }

  return ask.then(function(perm){
    if(perm==="denied") throw new Error("blocked");
    if(perm!=="granted") throw new Error("dismissed");
    return navigator.serviceWorker.register("sw.js");
  })
  .then(function(reg){ return navigator.serviceWorker.ready.then(function(){ return reg; }); })
  .then(function(reg){
    return fetch(API_BASE+"/api/config").then(function(r){ return r.json(); })
      .then(function(cfg){
        if(!cfg.vapid_public_key) throw new Error("server has no push keys set");
        return reg.pushManager.getSubscription().then(function(existing){
          return existing || reg.pushManager.subscribe({
            userVisibleOnly:true,
            applicationServerKey:urlB64ToUint8Array(cfg.vapid_public_key)
          });
        });
      });
  })
  .then(function(sub){
    var j=sub.toJSON();
    return fetch(API_BASE+"/api/subscribe",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({endpoint:j.endpoint, keys:j.keys})
    }).then(function(){
      pushState.subscribed=true;
      pushState.endpoint=j.endpoint;
      pushState.p256dh=j.keys?j.keys.p256dh:"";
      pushState.auth=j.keys?j.keys.auth:"";
      return {ok:true, endpoint:j.endpoint};

   that it lives on one device and can't email anyone; both need the
   backend, and both can be added without changing this shape.

var store=(function(){

  return {
    get:function(k){ try{ return ok?localStorage.getItem(k):mem[k]; }catch(e){ return mem[k]; } },
    set:function(k,v){ try{ if(ok) localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    persistent: ok

var CH=[/\bchapters?\s*[.:#-]?\s*(\d{1,4})/i,/\bch\s*[.:#-]?\s*(\d{1,4})\b/i,
/\bepisodes?\s*[.:#-]?\s*(\d{1,4})/i,/\bep\s*[.:#-]?\s*(\d{1,4})\b/i,/\bpart\s*[.:#-]?\s*(\d{1,4})\b/i];
var NOISE=new Set(("recap recaps recapped explained explanation review reviewed summary edit edits amv "+
"manhwa manhua manga anime webtoon comic full story series part chapter chapters ch episode episodes ep "+
"spoiler spoilers reaction shorts short viral fyp foryou foryoupage trending new latest update read "+
"reading watch watching best top the a an of and or in on manhwarecap mangarecap animerecap recapmanhwa").split(" "));
var SENT=new Set(("he she they we you when after before why how what who because so then but finally "+
"just never always everyone nobody his her their").split(" "));
var SPLIT=/[|｜•·—–\-\[\]()「」『』:：\/\\]/;
function clean(s){return (s||"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"");}
function exCh(c){var l=clean(c);for(var i=0;i<CH.length;i++){var m=l.match(CH[i]);
 if(m){var n=+m[1];if(n>0&&n<5000)return n;}}return null;}
function exTitle(c){
 var t=clean(c).replace(/#\w+/g," ").replace(/@\w+/g," ").replace(/https?:\/\/\S+/g," ");
 var cut=t.length;
 for(var i=0;i<CH.length;i++){var m=t.match(CH[i]);if(m&&m.index<cut)cut=m.index;}
 var h=cut>0?t.slice(0,cut):t;
 if(h.trim().length<3)h=t.split(SPLIT)[0]||"";
 var segs=h.split(SPLIT).map(function(s){return s.trim();}).filter(Boolean);
 if(!segs.length)return null;
 var cand=segs.reduce(function(a,b){return b.length>a.length?b:a;});
 var w=(cand.match(/[\w']+/g)||[]);
 while(w.length&&NOISE.has(w[0].toLowerCase()))w.shift();
 while(w.length&&NOISE.has(w[w.length-1].toLowerCase()))w.pop();
 var s=w.join(" ").trim();
 return (s.length<3||/^\d+$/.test(s))?null:s;
}
function trail(t){if(!t)return[t,null];var m=t.trim().match(/^(.*?)[\s#:-]+(\d{1,4})$/);
 if(!m)return[t,null];var h=m[1].trim();return h.length<3?[t,null]:[h,+m[2]];}
function prose(t){if(!t)return false;var w=t.toLowerCase().split(/\s+/);
 if(w.length<4)return false;if(SENT.has(w[0]))return true;
 return w.filter(function(x){return SENT.has(x);}).length>=2;}
function parseCaption(c){var t=exTitle(c),ch=exCh(c);
 if(ch===null&&t){var r=trail(t);t=r[0];if(r[1]!==null)ch=r[1];}
 var p=prose(t);
 return {title:t,chapter:ch,confidence:p?"low":(t&&ch?"high":(t?"medium":"none"))};}

/* Descriptions and audio transcripts are longer and messier than a caption
   -- exTitle()'s "pick the longest dash/colon-delimited segment" heuristic
   above was tuned for a single short line, and against multi-paragraph text
   it just as often picks unrelated prose (a copyright disclaimer runs on
   with no punctuation to split it, so it "wins" on raw length) as the real
   name. An explicit label is a much narrower, much more reliable signal
   when one's there, so it's checked first and separately -- only when none
   of these lines exist does deepenTitle() fall back to the generic
   heuristic, and only against the shorter caption/title text. */
var LABEL_WORDS=["manhwa","manhua","manga","comic","webtoon","source","sauce","title","name"];
// A leading label is often two words ("Manhwa Name:", "Source Manga:"), not
// just one, so this checks whether any label word appears anywhere before
// the first separator rather than anchoring the match to a single word.
function extractLabeledTitle(text){
 if(!text) return null;

 for(var i=0;i<lines.length;i++){
  var m=lines[i].trim().match(/^([^:\-–—]{0,40})[:\-–—]\s*(.+)$/);
  if(!m) continue;
  var label=m[1].toLowerCase();
  var hasWord=LABEL_WORDS.some(function(w){return label.indexOf(w)>-1;});
  if(!hasWord) continue;
  var val=m[2].replace(/#\w+/g," ").replace(/https?:\/\/\S+/g," ").trim();
  val=(val.split(SPLIT)[0]||"").trim();
  if(val.length>=3 && !/^\d+$/.test(val)) return val;

function ago(ts){
  if(!ts) return "";

/* Normalise the two providers' status vocabularies into one. A reader
   only cares about three things: can I binge it, am I waiting, or is it
   stalled. */
function statusInfo(raw){
  var v=(raw||"").toLowerCase().replace(/[\s_]+/g," ").trim();
  if(v.indexOf("finish")>-1 || v==="complete") return {key:"complete", label:"Complete", tone:"done"};
  if(v.indexOf("releasing")>-1||v.indexOf("publishing")>-1||v.indexOf("ongoing")>-1)
    return {key:"ongoing", label:"Ongoing", tone:"live"};
  if(v.indexOf("hiatus")>-1) return {key:"hiatus", label:"On hiatus", tone:"warn"};
  if(v.indexOf("cancel")>-1||v.indexOf("discontinu")>-1)
    return {key:"cancelled", label:"Cancelled", tone:"warn"};
  if(v.indexOf("not yet")>-1) return {key:"upcoming", label:"Not out yet", tone:"warn"};

function platformInfo(site){
  var l=(site||"").toLowerCase();

/* AniList lists the same publisher once per language, which is why
   WEBTOON showed up four times. Keep one entry per site, preferring the
   English edition. */
function dedupeLinks(links){
  var seen={}, out=[];
  links.forEach(function(l){
    var key=(l.site||"").toLowerCase().trim();
    if(!key) return;
    var lang=(l.language||"").toLowerCase();
    var isEn = !lang || lang.indexOf("english")>-1;
    if(!(key in seen)){ seen[key]=out.length; out.push(l); return; }
    // Already have this site — swap in the English one if we found it later.
    var prev=out[seen[key]];
    var prevLang=(prev.language||"").toLowerCase();
    var prevEn = !prevLang || prevLang.indexOf("english")>-1;
    if(isEn && !prevEn) out[seen[key]]=l;

  return out;
}

  return dedupeLinks(links).sort(function(a,b){
    if(a.official!==b.official) return a.official?-1:1;
    var ai=platformInfo(a.site), bi=platformInfo(b.site);
    var ac=ai?COST_ORDER[ai.cost]:9, bc=bi?COST_ORDER[bi.cost]:9;
    return ac-bc;               // free options first
  });
}
function score(c,g,cap){var names=[c.title].concat(c.alts||[]);
 g=(g||"").toLowerCase();cap=(cap||"").toLowerCase();var best=0;
 names.forEach(function(n){if(!n)return;var nn=n.toLowerCase(),r=similar(g,nn);
  if(nn===g)r=1;else if(nn.length>4&&cap.indexOf(nn)>-1)r=Math.max(r,.92);
  best=Math.max(best,r);});return best;}

    if(tries>1 && transient)

/* Wraps fetch with a hard timeout. Without this, one slow or unresponsive

  var genres=(a.tags||[]).filter(function(t){ return t.attributes.group==="genre"; })
    .map(function(t){ return t.attributes.name.en||""; }).filter(Boolean);
  var rating=a.contentRating||"";
  var desc=a.description||{};
  return {id:"md-"+m.id,
   title:mdTitle(a),
   alts:(a.altTitles||[]).map(function(x){ return Object.values(x)[0]; }).filter(Boolean),
   chapters:a.lastChapter?(parseFloat(a.lastChapter)||null):null,
   volumes:a.lastVolume?(parseInt(a.lastVolume,10)||null):null,
   status:a.status||"",country:country,kind:kindFromCountry(country),
   started:a.year?{year:a.year}:null,ended:null,
   updatedAt:a.updatedAt?Math.floor(new Date(a.updatedAt).getTime()/1000):null,
   popularity:0,   // MangaDex's search response carries no follow count
   adult:rating==="erotica"||rating==="pornographic",
   genres:genres,
   synopsis:cleanSynopsis(desc.en||Object.values(desc)[0]||""),
   cover:cover?"https://uploads.mangadex.org/covers/"+m.id+"/"+cover.attributes.fileName+".256.jpg":"",
   links:[{site:"MangaDex",url:"https://mangadex.org/title/"+m.id,language:"",official:false}]};
}
function mdSearch(q,n){
  var p=new URLSearchParams();
  p.set("title",q);
  p.set("limit",String(n||8));
  ["safe","suggestive","erotica","pornographic"].forEach(function(r){
    p.append("contentRating[]",r); });
  p.append("includes[]","cover_art");
  return fetchTimeout(via("https://api.mangadex.org/manga?"+p.toString())).then(function(r){
    if(!r.ok) throw new Error("MangaDex "+r.status);
    return r.json();
  }).then(function(j){ return (j.data||[]).map(mdShape); });
}

/* --- unified --- */
function dropAdult(rows){
  if(!HIDE_ADULT) return rows||[];
  return (rows||[]).filter(function(m){ return !m.adult; });
}

function search(q,n,noRespell){
  // AniList first: it answers in well under a second and covers manhwa
  // and manhua far better than Jikan, which skews toward anime-adjacent
  // titles. Jikan used to go first, and when it was down every search sat
  // on "Working…" for 30+ seconds (three tries, each waiting out a
  // timeout) before AniList was even asked. Every stage falls through to
  // the next on either a failure or a genuinely empty result.
  return withRetry(function(){return alSearch(q,n);},2)
    .then(function(r){ sourceUsed="AniList"; return dropAdult(r); })
    .catch(function(){ sourceUsed=null; return []; })
    .then(function(rows){
      if(rows && rows.length) return rows;
      var priorSource=sourceUsed;
      return jikanSearch(q,n).then(function(r){
        sourceUsed = priorSource ? "Jikan ("+priorSource+" had nothing)" : "Jikan (AniList down)";
        return dropAdult(r);
      }).catch(function(){ return rows; });
    })
    .then(function(rows){
      if(rows && rows.length) return rows;
      var priorSource=sourceUsed;
      return mdSearch(q,n).then(function(r){
        sourceUsed="MangaDex ("+priorSource+" had nothing)";
        return dropAdult(r);
      }).catch(function(){ return rows; });   // still nothing -- keep the empty result
    })
    .then(function(rows){
      // A misspelled name ("Greymark" for The Graymark) finds nothing on
      // any of the above, which all need the spelling close. MangaUpdates'
      // search forgives spelling: search again under the name it suggests.
      if((rows && rows.length) || noRespell) return rows;
      return muRespell(q).then(function(name){
        if(!name) return rows;
        return search(name,n,true).then(function(r){
          if(r.length) sourceUsed+=" · spelled as \""+name+"\" by MangaUpdates";
          return r.length ? r : rows;
        });
      }).catch(function(){ return rows; });
    });
}
// The closest comic MangaUpdates has for a query, if it's close enough to
// be the same name misspelled -- or null.
function muRespell(q){
  return fetch(via(MU+"/series/search"),{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({search:q, perpage:5})
  }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    // Letters only, without a leading "The": "Greymatk" vs "The Graymark"
    // scores 0.43, unrelated suggestions ("xyzzy foo" -> "Foo Fighter
    // Fuji") about 0.2.
    var bare=function(t){ return t.toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]/g,""); };
    var best=null, bestScore=0.4;
    ((j&&j.results)||[]).forEach(function(x){
      var rec=x.record||x;
      if(!rec || !rec.title || !isComic(rec)) return;
      var t=String(rec.title).replace(/<[^>]*>/g,"");
      var sc=similar(bare(q),bare(t));
      if(sc>=bestScore && bare(t)!==bare(q)){ best=t; bestScore=sc; }
    });
    return best;
  });
}
function trending(country,genre){
  // AniList first here — its TRENDING_DESC is genuinely "what people are
  // reading now", while Jikan's top list is all-time ranking. AniList is
  // also the stronger of the two for Korean webtoons, which is most of
  // what gets recapped.
  return withRetry(function(){return alTrending(country,genre);})
    .then(function(r){ sourceUsed="AniList"; return dropAdult(r); })
    .catch(function(){
      // Jikan's top list filters by neither origin nor genre, so both are
      // applied after the fact.
      return jikanTop().then(function(r){
        r=dropAdult(r);
        sourceUsed="Jikan (AniList down)";
        if(country){
          var want = country==="KR" ? "Manhwa" : country==="CN" ? "Manhua" : "Manga";
          r=r.filter(function(m){ return m.kind===want; });
        }
        if(genre){
          r=r.filter(function(m){
            return (m.genres||[]).some(function(g){
              return String(g).toLowerCase()===genre.toLowerCase(); });
          });
        }
        return r;
      });
    });
}

/* ================= MangaUpdates: latest released chapter =================
   AniList and MyAnimeList only publish a chapter count once a series has
   FINISHED — their own staff have said tracking ongoing counts is
   unworkable. MangaUpdates does track it, keyless, via its v1 API.

   Caveat carried into the UI: MangaUpdates counts scanlation releases,
   so this is where the story has got to, not necessarily what is legally
   readable in English yet. Those are different numbers and we label them
   differently.                                                          */
var MU="https://api.mangaupdates.com/v1";
var muCache={};

var DEBUG = new URLSearchParams(location.search).has("debug");
var lastMuRaw = null;   // kept so the debug view can show what came back

/* Ask MangaUpdates for a series. Returns either {chapter,...} or
   {error:"reason"} — never a bare null, because "it didn't work" without
   a reason is what made this hard to diagnose in the first place. */
/* Two calls, because MangaUpdates splits the data:
     1. POST /series/search  -> finds the series, gives its id
     2. GET  /series/{id}    -> the actual latest_chapter and last_updated
   The search result alone has no chapter number, which is what "no
   chapter field" was telling us.                                        */
/* Two calls, because MangaUpdates splits the data:
     1. POST /series/search  -> finds candidates and their ids
     2. GET  /series/{id}    -> the actual latest_chapter and last_updated

   And we check several candidates, not just the best-named one. Long
   manhwa get split into separate season records ("X", "X Season 2"),
   each numbered from 1, so the closest title match is often the lowest
   number. Taking the highest across strong matches gets us the real
   position in the story.                                                */
/* Season detection. Long manhwa are split into separate MangaUpdates
   records, each numbered from 1 — "Overgeared", "Overgeared (Season 2)",
   and so on. Readers think in seasons, so we keep them apart instead of
   flattening them into one misleading number. */
function seasonOf(title){
  var t=(title||"");
  var m=t.match(/season\s*(\d+)/i)
      || t.match(/\bs(\d+)\b/i)
      || t.match(/\bpart\s*(\d+)/i)
      || t.match(/\b(\d+)(?:nd|rd|th)\s+season/i);
  if(m) return parseInt(m[1],10);
  if(/\bseason\s*ii\b/i.test(t)) return 2;
  if(/\bseason\s*iii\b/i.test(t)) return 3;
  return 1;
}

/* MangaUpdates indexes novels next to comics, and a web novel usually
   runs far more chapters than its manhwa adaptation. Matching one gives
   a wildly wrong number, so exclude anything that isn't a comic. */
var COMIC_TYPES=["manga","manhwa","manhua","manhpa","oel","comic"];
function isComic(rec){
  var t=(rec && rec.type ? String(rec.type) : "").toLowerCase();
  if(!t) return true;                       // no type stated: allow it
  if(t.indexOf("novel")>-1) return false;
  if(t.indexOf("artbook")>-1||t.indexOf("doujin")>-1) return false;
  return COMIC_TYPES.some(function(c){ return t.indexOf(c)>-1; }) || true;
}

function muFetch(title){
  return fetch(via(MU+"/series/search"),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({search:title})
  }).then(function(r){
    return r.text().then(function(txt){
      lastMuRaw="SEARCH: "+txt.slice(0,1500);
      if(!r.ok) return {error:"search HTTP "+r.status};
      var j;
      try{ j=JSON.parse(txt); }catch(e){ return {error:"search returned non-JSON"}; }
      if(j && j.error) return {error:"proxy: "+j.error};
      var results=(j&&j.results)||[];
      if(!results.length) return {error:"no results"};

      var scored=[];
      results.forEach(function(x){
        var rec=x.record||x;
        if(!rec || !(rec.series_id||rec.id)) return;
        if(!isComic(rec)) return;                       // drop novels
        var names=[rec.title].concat(
          rec.associated? rec.associated.map(function(a){return a.title;}) : []);
        var best=0;
        names.forEach(function(n){ best=Math.max(best, similar(title, n||"")); });
        if(best>=0.5) scored.push({rec:rec, score:best});
      });
      if(!scored.length) return {error:"no comic match (novels excluded)"};
      scored.sort(function(a,b){ return b.score-a.score; });

      var picks=scored.slice(0,4);
      return Promise.all(picks.map(function(p){
        return muSeries(p.rec.series_id||p.rec.id, p.rec.title, p.score, p.rec.type);
      })).then(function(all){
        var good=all.filter(function(x){ return x && x.chapter; });
        if(!good.length){
          var firstErr=(all.find(function(x){ return x && x.error; })||{}).error;
          return {error: firstErr || "no chapter number on any record"};
        }

        // Build the season list, newest last.
        var seasons=good.map(function(g){
          return {n:seasonOf(g.title), title:g.title, chapter:g.chapter,
                  completed:g.completed, updated:g.updated};
        }).sort(function(a,b){ return a.n-b.n; });

        // Deduplicate: same season number can come back twice.
        var byN={};
        seasons.forEach(function(s){
          if(!byN[s.n] || s.chapter>byN[s.n].chapter) byN[s.n]=s;
        });
        seasons=Object.keys(byN).map(function(k){return byN[k];})
                      .sort(function(a,b){ return a.n-b.n; });

        // The reader's current position is the newest season, not the
        // biggest number — season 3 chapter 24 comes after season 2's 180.
        var current=seasons[seasons.length-1];
        var src=good.filter(function(g){ return g.title===current.title; })[0]||good[0];

        return {chapter:current.chapter, season:current.n,
                seasons:seasons.length>1?seasons:null,
                title:current.title, updated:current.updated,
                completed:current.completed, licensed:src.licensed};
      });
    });
  }).catch(function(e){
    return {error:"search failed: "+(e.message||e)};
  });
}

function muSeries(id, fallbackTitle, score, type){
  return fetch(via(MU+"/series/"+id)).then(function(r){
    return r.text().then(function(txt){
      lastMuRaw=(lastMuRaw||"")+"\n\nSERIES "+id+": "+txt.slice(0,700);
      if(!r.ok) return {error:"series HTTP "+r.status};
      var d;
      try{ d=JSON.parse(txt); }catch(e){ return {error:"series returned non-JSON"}; }
      if(d && d.error) return {error:"proxy: "+d.error};
      if(!isComic(d)) return {error:"novel, skipped"};

      var raw=d.latest_chapter;
      if(raw==null && d.status){
        var m=String(d.status).match(/(\d{1,4})\s*chapters?/i);
        if(m) raw=m[1];
      }
      var n=parseInt(raw,10);

      var updated=null;
      if(d.last_updated){
        if(d.last_updated.timestamp) updated=d.last_updated.timestamp;
        else if(d.last_updated.as_rfc3339){
          var t=new Date(d.last_updated.as_rfc3339);
          if(!isNaN(t)) updated=Math.floor(t.getTime()/1000);
        }
      }
      if(!(n>0)) return {error:"no chapter number on series record"};
      return {chapter:n, title:d.title||fallbackTitle||"", score:score,
              updated:updated, completed:!!d.completed, licensed:!!d.licensed};
    });
  }).catch(function(e){
    return {error:"series lookup failed: "+(e.message||e)};
  });
}

function muLatestRaw(title){
  return muFetch(title).then(function(r){
    if(r.error) throw new Error(r.error);
    return r;
  });
}

function muLatest(title){
  var key=(title||"").toLowerCase();
  if(key in muCache) return Promise.resolve(muCache[key]);
  return muFetch(title).then(function(r){
    if(r.error){ setDiag("MangaUpdates: "+r.error); muCache[key]={fail:r.error}; return muCache[key]; }
    muCache[key]=r;
    return r;
  });
}

/* ================= WEBTOON: the publisher's own number =================
   MangaUpdates counts fan releases, which stop the moment a series is
   licensed — that's why Overgeared read 24 when Bilibili said 308. The
   publisher always knows. WEBTOON exposes a per-series RSS feed, so for
   anything hosted there we can read the true latest episode.

   Turn any series URL into its feed by swapping the path segment for
   /rss and keeping title_no:
     .../en/action/tower-of-god/list?title_no=95
     .../en/action/tower-of-god/rss?title_no=95                          */
function webtoonRssUrl(seriesUrl){
  try{
    var u=new URL(seriesUrl);
    if(u.hostname.indexOf("webtoons.com")===-1) return null;
    var titleNo=u.searchParams.get("title_no");
    if(!titleNo) return null;
    // Keep language/genre/slug and drop everything after it. A viewer URL
    // is [en, fantasy, slug, episode-1, viewer]; a list URL is
    // [en, action, slug, list]. Both reduce to the same feed.
    var parts=u.pathname.split("/").filter(Boolean);
    if(parts.length<3) return null;
    return u.origin+"/"+parts.slice(0,3).join("/")+"/rss?title_no="+titleNo;
  }catch(e){ return null; }
}

function webtoonLatest(links){
  var wt=(links||[]).filter(function(l){
    return /webtoons\.com/i.test(l.url||"") && webtoonRssUrl(l.url);
  })[0];
  if(!wt) return Promise.resolve(null);
  var feed=webtoonRssUrl(wt.url);

  return fetch(via(feed)).then(function(r){
    if(!r.ok) throw new Error("WEBTOON RSS "+r.status);
    return r.text();
  }).then(function(xml){
    var doc=new DOMParser().parseFromString(xml,"text/xml");
    var items=doc.querySelectorAll("item");
    if(!items.length) return null;
    // The episode number lives in each item's link as episode_no=N.
    var highest=0, when=null;
    items.forEach(function(it){
      var link=(it.querySelector("link")||{}).textContent||"";
      var m=link.match(/episode_no=(\d+)/);
      if(m){
        var n=parseInt(m[1],10);
        if(n>highest){
          highest=n;
          var d=(it.querySelector("pubDate")||{}).textContent;
          var t=d? new Date(d):null;
          when=(t && !isNaN(t))? Math.floor(t.getTime()/1000) : null;
        }
      }
    });
    return highest>0 ? {chapter:highest, updated:when, source:"WEBTOON",
                        url:wt.url} : null;
  }).catch(function(e){
    setDiag("WEBTOON feed: "+(e.message||e));
    return null;
  });
}

/* ================= oEmbed ================= */
/* Official embed URL for a video, so someone can watch/listen right in
   the app when the caption alone doesn't name the manga -- some edits
   only say or show the title in the video itself. Both endpoints are
   the platforms' own, meant for exactly this (nothing scraped, nothing
   downloaded): TikTok's is https://www.tiktok.com/embed/v2/<id>, and its
   oEmbed response already hands back that id directly as
   embed_product_id (falls back to pulling it out of the embed HTML's
   data-video-id if that field is ever missing). YouTube has no such
   field, but the id is already sitting in the URL that was pasted in. */
function ytId(url){
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/i);
  return m?m[1]:null;
}
function embedUrlFor(tt,url,d){
  if(tt){
    var id=d.embed_product_id || ((d.html||"").match(/data-video-id="(\d+)"/)||[])[1];
    return id ? "https://www.tiktok.com/embed/v2/"+id : null;
  }
  var yid=ytId(url);
  return yid ? "https://www.youtube-nocookie.com/embed/"+yid : null;
}
function oembed(url){
  var tt=/tiktok\.com/i.test(url), yt=/youtube\.com|youtu\.be/i.test(url);
  if(!tt&&!yt) return Promise.reject(new Error("unsupported"));
  var ep = tt ? "https://www.tiktok.com/oembed?url="+encodeURIComponent(url)
              : "https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(url);
  return fetchTimeout(via(ep)).then(function(r){
    // A real HTTP response means CORS allowed the request — the platform
    // answered, it just didn't like the URL.
    if(r.status===404) throw new Error("notfound|That video is private, deleted, or the link is wrong.");
    // YouTube's oEmbed specifically uses 401 for "the uploader turned off
    // embedding for this video" — not an auth problem on our end, and not
    // fixable by retrying. The embed player would fail the exact same way
    // (YouTube enforces the same restriction there), so there's no
    // fallback player worth offering for this one.
    if(!tt && r.status===401)
      throw new Error("embeddisabled|The uploader has disabled embedding for this video, "+
        "so its caption can't be read automatically.");
    if(!r.ok) throw new Error("http|"+(tt?"TikTok":"YouTube")+" returned "+r.status+".");
    return r.json();
  }).then(function(d){
    return {caption:d.title||"", author:d.author_name||"", platform:tt?"TikTok":"YouTube",
            embedUrl:embedUrlFor(tt,url,d), embedTall:tt};
  }).catch(function(e){
    if(e.message && e.message.indexOf("|")>-1) throw e;
    // fetch() rejects (rather than resolving) only for CORS or network
    // failures, so this branch is the CORS answer we've been waiting for.
    throw new Error("cors|"+(tt?"TikTok":"YouTube")+" blocked the request from this page "+
      "(no CORS header). Reading captions has to happen server-side.");
  });
}

/* oEmbed only ever returns the video's *caption* (or, for YouTube, just its
   title) — never the upload description, and never anything from the audio
   track. Plenty of edits name the manga in one of those two places instead
   of the caption, and neither is blocked by an embedding restriction the way
   oEmbed itself is: the video is still fully public, so the backend can
   read its description and (for clips short enough to be worth it)
   transcribe its audio. Best-effort — a failure here just means no extra
   text came back, same as if this hadn't been tried at all. */
function deepenTitle(url, existingCaption){
  var out=document.getElementById("out");
  if(out) out.innerHTML='<div class="spin">Checking the video’s description and audio for a name…</div>';
  var ep=API_BASE+"/api/video-lookup?url="+encodeURIComponent(url);
  return fetchTimeout(ep, null, 45000).then(function(r){
    if(!r.ok) throw new Error("lookup failed");
    return r.json();
  }).then(function(d){
    var all=[existingCaption,d.title,d.description,d.transcript].filter(Boolean).join("\n");
    var ch=exCh(all);
    var labeled=extractLabeledTitle(d.description)||extractLabeledTitle(d.transcript);
    if(labeled) return {title:labeled, chapter:ch, confidence:"medium",
                         caption:existingCaption||d.title||""};
    // No explicit label -- safe to run the generic heuristic only on the
    // short pieces, never the raw description (see extractLabeledTitle's
    // comment above for why).
    var p=parseCaption([existingCaption,d.title,d.transcript].filter(Boolean).join("\n"));
    return {title:p.title, chapter:p.chapter===null?ch:p.chapter, confidence:p.confidence,
            caption:existingCaption||d.title||""};
  }).catch(function(){
    return {title:null, chapter:null, confidence:"none", caption:existingCaption||""};
  });
}

}

/* Title health (server/health.py): the server checks in the background
   that each title the site shows really opens in the reader. Browsing
   rows drop titles that failed their last check; anything not checked yet
   still shows (and gets queued). If the check can't be reached, nothing
   is hidden. */
function healthFilter(rows){
  if(!READER_BASE || !rows || !rows.length) return Promise.resolve(rows||[]);
  var body=JSON.stringify({titles:rows.map(function(r){
    return {title:r.title, alts:(r.alts||[]).slice(0,6)}; })});
  return fetchTimeout(READER_BASE+"/api/health/status",
      {method:"POST", headers:{"Content-Type":"application/json"}, body:body}, 4000)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      var st=(d&&d.statuses)||{};
      return rows.filter(function(r){ return st[r.title]!=="broken"; });
    })
    .catch(function(){ return rows; });
}

// A title a reader couldn't open: the server re-checks it soon. Once per
// title per visit is plenty.
var reportedUnreadable={};
function reportUnreadable(m){
  if(!READER_BASE || !m || !m.title || reportedUnreadable[m.title]) return;
  reportedUnreadable[m.title]=true;
  fetch(READER_BASE+"/api/health/report",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:m.title, alts:(m.alts||[]).slice(0,6)}), keepalive:true})
    .catch(function(){});
}

function loadTrending(country,genre){
  curFilter=country||"";
  if(genre!==undefined) curGenre=genre||"";
  var el=document.getElementById("trend");
  if(!el) return;
  el.innerHTML='<h3>Trending now</h3>'+chips(curFilter)+
    ['a','b'].map(function(){ return '<div class="railwrap"><div class="rail"><div class="track">'+
    Array(8).fill('<div class="tile"><div class="skel"></div></div>').join("")+
    '</div></div></div>'; }).join("");
  wireChips();
  wireGenreToggle();
  trending(curFilter,curGenre).then(healthFilter).then(function(rows){
    setDiag("source: "+sourceUsed);
    var el=document.getElementById("trend");
    if(!el) return;
    if(!rows.length){
      el.innerHTML='<h3>Trending now</h3>'+chips(curFilter)+
        '<div class="note"><p><strong>Nothing trending in that combination</strong>'+
        (curGenre&&curFilter
          ? "No "+esc(curGenre.toLowerCase())+" titles are trending in that category right now. "+
            "Try widening one of the two filters."
          : "Nothing came back for that filter. Try Everything.")+'</p></div>';
      wireChips(); return;
    }
    // Split into two rows so more of the list is visible at once, and run
    // them in opposite directions — a single direction reads as one long
    // conveyor and you lose track of what you've already seen.
    var mid=Math.ceil(rows.length/2);
    var rowA=rows.slice(0,mid), rowB=rows.slice(mid);
    if(!rowB.length){ rowB=rowA; }

    function railHtml(list,id,rev){
      return '<div class="railwrap">'+
        '<button class="arrow l" aria-hidden="true" tabindex="-1">&#8249;</button>'+
        '<button class="arrow r" aria-hidden="true" tabindex="-1">&#8250;</button>'+
        '<div class="rail" id="rail-'+id+'">'+
        '<div class="track" id="track-'+id+'">' +
        list.concat(list).map(function(m,i){
          var dup=i>=list.length;
          return '<button class="tile" data-row="'+id+'" data-i="'+(i%list.length)+'"'+
            (dup?' aria-hidden="true" tabindex="-1"':'')+'>'+
            (m.cover?'<img loading="lazy" alt="" src="'+esc(m.cover)+'" referrerpolicy="no-referrer">':'<div class="ph"></div>')+
            '<h4>'+esc(m.title)+'</h4><p class="meta">'+esc(m.kind||"")+
            (m.chapters?" · "+m.chapters+" ch":"")+
            (statusInfo(m.status).key==="complete"?' · done':"")+'</p></button>';
        }).join("")+'</div></div></div>';
    }

    el.innerHTML='<h3>Trending now</h3>'+chips(curFilter)+
      railHtml(rowA,"a",false)+railHtml(rowB,"b",true);
    railData={a:rowA,b:rowB};
    wireChips();
    startRail();
    var t=el.querySelectorAll(".tile");
    for(var k=0;k<t.length;k++)
      t[k].onclick=(function(m){return function(){showDetail(m,null);};})(
        railData[t[k].dataset.row][+t[k].dataset.i]);
  }).catch(function(e){
    setDiag("both sources down: "+e.message);
    var el=document.getElementById("trend");
    if(el){ el.innerHTML='<h3>Trending now</h3>'+chips(curFilter)+
      '<div class="note bad"><p><strong>Both data sources are unreachable</strong>'+
      esc(e.message)+'. Jikan and AniList are free community APIs with no uptime '+
      'commitment. This is the argument for caching results in your own database.</p></div>';
      wireChips(); }
  });
}

/* Search-as-you-type. Typing "over" should offer Overgeared, not tell
   you there's no match — nobody types a full manhwa title, and half of
   them have three different romanisations anyway. */
var sugTimer=null, sugSeq=0, sugRows=[], sugIndex=-1;

function wireSuggest(input){
  if(!input) return;
  input.addEventListener("input", function(){
    var v=input.value.trim();
    if(/^https?:\/\//i.test(v)){ hideSuggest(); return; }   // a link isn't a search
    clearTimeout(sugTimer);
    if(v.length<2){ hideSuggest(); return; }   // 1 char matches everything
    // Wait for a pause in typing — one request per word, not per letter.
    sugTimer=setTimeout(function(){ fetchSuggest(v); }, 280);
  });
  input.addEventListener("keydown", function(e){
    var box=document.getElementById("suggest");
    var open=box && !box.hidden && sugRows.length;
    if(e.key==="Enter"){
      if(open && sugIndex>=0){ e.preventDefault(); pickSuggest(sugIndex); }
      else { hideSuggest(); run(); }
      return;
    }
    if(!open) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); moveSuggest(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveSuggest(-1); }
    else if(e.key==="Escape"){ hideSuggest(); }
  });
  input.addEventListener("blur", function(){
    // Delay so a click on a suggestion still registers.
    setTimeout(hideSuggest, 160);
  });
}

function fetchSuggest(q){
  var seq=++sugSeq;
  // Cast a wider net for suggestions than for a full search — the title
  // you want may be the 15th result the provider returns, and we're
  // about to re-rank anyway.
  search(q, 25).then(function(rows){
    if(seq!==sugSeq) return;          // a newer keystroke already won
    showSuggest(rankSuggestions(rows, q).slice(0,7));
  }).catch(function(){ hideSuggest(); });
}

/* Rank by how the title matches, then by how many people read it.
   Typing "over" was returning "Over! Over! Over!" and "OVER OVER OVER!"
   — both technically better string matches than Overgeared, and both
   read by almost nobody. Popularity is what separates them. */
function rankSuggestions(rows, q){
  var ql=q.toLowerCase().trim();
  var maxPop=1;
  rows.forEach(function(m){ maxPop=Math.max(maxPop, m.popularity||0); });

  function tier(m){
    var names=[m.title].concat(m.alts||[]).filter(Boolean)
                .map(function(t){ return t.toLowerCase(); });
    if(names.some(function(t){ return t===ql; })) return 0;         // exact
    if(names.some(function(t){ return t.indexOf(ql)===0; })) return 1; // starts with
    if(names.some(function(t){                                        // word starts with
      return t.split(/[\s:,\-]+/).some(function(w){ return w.indexOf(ql)===0; });
    })) return 2;
    if(names.some(function(t){ return t.indexOf(ql)>-1; })) return 3;  // contains
    return 4;
  }

  return rows.map(function(m){
    var t=tier(m);
    var pop=Math.log10(1+(m.popularity||0))/Math.log10(1+maxPop);   // 0..1
    // Tier dominates, popularity breaks ties within it. Half a tier of
    // weight is enough to float a hugely popular title above an obscure
    // one that matched slightly better.
    return {m:m, score:t - pop*0.6};
  }).sort(function(a,b){ return a.score-b.score; })
    .map(function(x){ return x.m; });
}

function showSuggest(rows){
  var box=document.getElementById("suggest");
  if(!box) return;
  sugRows=rows; sugIndex=-1;
  if(!rows.length){ hideSuggest(); return; }
  box.innerHTML=rows.map(function(m,i){
    return '<button class="sug" data-i="'+i+'">'+
      (m.cover?'<img alt="" src="'+esc(m.cover)+'" referrerpolicy="no-referrer">':'<span class="sph"></span>')+
      '<span class="sinfo"><span class="st">'+esc(m.title)+'</span>'+
      '<span class="sm">'+esc(m.kind||"")+
      (m.chapters?" · "+m.chapters+" ch":"")+' · '+esc(statusInfo(m.status).label)+
      (m.adult?' · <span class="adultflag">18+</span>':"")+
      (m.popularity>5000?' · <span class="pop">popular</span>':"")+
      '</span></span></button>';
  }).join("");
  box.hidden=false;
  var els=box.querySelectorAll(".sug");
  for(var i=0;i<els.length;i++){
    els[i].onmousedown=(function(n){ return function(e){ e.preventDefault(); pickSuggest(n); }; })(i);
  }
}

function moveSuggest(d){
  var box=document.getElementById("suggest");
  if(!box) return;
  var els=box.querySelectorAll(".sug");
  if(!els.length) return;
  sugIndex=(sugIndex+d+els.length)%els.length;
  for(var i=0;i<els.length;i++) els[i].classList.toggle("on", i===sugIndex);
  els[sugIndex].scrollIntoView({block:"nearest"});
}

function pickSuggest(i){
  var m=sugRows[i];
  if(!m) return;
  hideSuggest();
  var input=document.getElementById("q");
  if(input) input.value=m.title;
  showDetail(m, null);
}

function hideSuggest(){
  var box=document.getElementById("suggest");
  if(box){ box.hidden=true; box.innerHTML=""; }
  sugRows=[]; sugIndex=-1;
}

function wireChips(){
  wireGenreToggle();   // one component, one wiring call
  var cs=document.querySelectorAll(".chip");
  for(var i=0;i<cs.length;i++){
    (function(el){
      el.onclick=function(){
        // Origin chips carry data-c, genre chips data-g. Changing one
        // leaves the other alone, so the two filters combine.
        if(el.dataset.g!==undefined) loadTrending(curFilter, el.dataset.g);
        else loadTrending(el.dataset.c, curGenre);
      };
    })(cs[i]);
  }
}

/* ---- carousel ----
   Drifts along on its own, but it is a real scroller underneath: swipe it,
   drag it, or use the arrows, and a cover that has gone past is one gesture
   away. Auto-advance stops the moment you touch it and only picks up again
   after a few idle seconds. */
var RAIL_SPEED = 22;   // pixels per second — a slow, readable drift
var RESUME_MS  = 2500; // idle time before the drift starts again
var railData = {a:[], b:[]};
var railTimers = [];

function startRail(){
  stopRail();
  ["a","b"].forEach(function(id,i){ initRail("rail-"+id, "track-"+id, i===1); });
}

function initRail(railId, trackId, reverse){
  var rail=document.getElementById(railId), track=document.getElementById(trackId);
  if(!rail||!track) return;

  var oneSet=0, paused=false, idleTimer=null, raf=null, last=0, carry=0;

  function measure(){
    var tiles=track.querySelectorAll(".tile");
    if(!tiles.length) return false;
    var w=tiles[0].getBoundingClientRect().width;
    if(w<20){ fallback("cover width "+Math.round(w)+"px"); return false; }
    // The list is rendered twice, so one set's width is the point at which
    // the view is identical again and the position can be reset unseen.
    oneSet=(tiles.length/2)*(w+12);
    return true;
  }

  function wrap(){
    if(!oneSet) return;
    if(rail.scrollLeft >= oneSet) rail.scrollLeft -= oneSet;
    else if(rail.scrollLeft <= 0) rail.scrollLeft += oneSet;
  }

  function frame(now){
    if(!document.body.contains(rail)) return;
    var dt=last ? (now-last)/1000 : 0;
    last=now;
    if(!paused && dt>0 && dt<0.5){
      carry += RAIL_SPEED*dt*(reverse?-1:1);
      // scrollLeft is integer-only, so spend whole pixels and bank the rest.
      var whole = carry>0 ? Math.floor(carry) : Math.ceil(carry);
      if(whole){ rail.scrollLeft += whole; carry -= whole; wrap(); }
    }
    raf=requestAnimationFrame(frame);
  }

  function pause(){
    paused=true;
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){ paused=false; }, RESUME_MS);
  }

  function fallback(why){
    rail.classList.add("grid");
    if(raf) cancelAnimationFrame(raf);
    setDiag("grid mode ("+why+")");
  }

  function begin(){
    if(!measure()) return;
    // Reversed row starts a set in, so it has somewhere to scroll back to.
    if(reverse && rail.scrollLeft===0) rail.scrollLeft=oneSet;
    if(raf) cancelAnimationFrame(raf);
    last=0; carry=0;
    raf=requestAnimationFrame(frame);
    railTimers.push(function(){ if(raf) cancelAnimationFrame(raf); });
  }

  ["pointerdown","touchstart","wheel","mouseenter"].forEach(function(ev){
    rail.addEventListener(ev, pause, {passive:true});
  });
  rail.addEventListener("scroll", function(){ wrap(); }, {passive:true});
  rail.addEventListener("mouseleave", function(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){ paused=false; }, 400);
  });

  // Arrows move by roughly a screenful, so it feels like paging rather
  // than nudging one cover at a time.
  var wrapEl=rail.parentNode;
  wrapEl.querySelectorAll(".arrow").forEach(function(btn){
    btn.onclick=function(){
      pause();
      var step=Math.max(rail.clientWidth*0.8, 200);
      rail.scrollBy({left: btn.classList.contains("l") ? -step : step,
                     behavior:"smooth"});
    };
  });

  if(document.readyState==="complete") setTimeout(begin,60);
  else window.addEventListener("load",function(){setTimeout(begin,60);},{once:true});
  setTimeout(begin,300);
}

function stopRail(){
  railTimers.forEach(function(cancel){ try{ cancel(); }catch(e){} });
  railTimers=[];
  exitReaderChrome();
}

/* Auto-hiding header/tab bar while reading: scrolling down hides both so
   the page itself, and now people's comments and recommendations, aren't
   crowded by chrome that's already served its purpose; scrolling up (or
   being near the top) brings them straight back. Scoped to the reader via
   body.reading so it never touches any other view. exitReaderChrome() is
   called from stopRail(), which already runs at the start of every other
   view-transition function, so leaving the reader always cleans this up. */
var readerScrollY=0, readerChromeWired=false;

function onReaderScroll(){
  var y=window.scrollY||window.pageYOffset||0;
  if(y<=60){ document.body.classList.remove("chrome-hidden"); readerScrollY=y; return; }
  if(y>readerScrollY+4) document.body.classList.add("chrome-hidden");
  else if(y<readerScrollY-4) document.body.classList.remove("chrome-hidden");
  readerScrollY=y;
}

function enterReaderChrome(){
  document.body.classList.add("reading");
  document.body.classList.remove("chrome-hidden");
  readerScrollY=window.scrollY||0;
  if(!readerChromeWired){
    window.addEventListener("scroll", onReaderScroll, {passive:true});
    readerChromeWired=true;
  }
}

function exitReaderChrome(){
  stopNarration();
  document.body.classList.remove("reading","chrome-hidden");
  if(readerChromeWired){
    window.removeEventListener("scroll", onReaderScroll);
    readerChromeWired=false;
  }
}

function run(){
  var raw=document.getElementById("q").value.trim(); if(!raw) return;
  stopRail();
  var out=document.getElementById("out"), btn=document.getElementById("go");
  var tr=document.getElementById("trend"); if(tr) tr.style.display="none";
  btn.disabled=true; out.innerHTML='<div class="spin">Working…</div>';
  var isLink=/^https?:\/\//i.test(raw);
  // Opened from a post's list: keep a way back to that list.
  var fromPost = postBack && postBack.titles.indexOf(raw)>-1 ? postBack : null;
  if(!fromPost) postBack=null;
  var job = isYtPost(raw) ? postLookup(raw)
    : isLink
    ? oembed(raw).then(function(meta){
        var p=parseCaption(meta.caption);
        if(p.title) return search(p.title).then(function(rows){
          return {kind:"results",rows:rows,parsed:p,caption:meta.caption,
                  author:meta.author,platform:meta.platform,
                  embedUrl:meta.embedUrl,embedTall:meta.embedTall};});
        // The caption alone didn't name it — try the description/audio
        // before giving up.
        return deepenTitle(raw, meta.caption).then(function(deep){
          if(!deep.title) return {kind:"noTitle",caption:meta.caption,
            embedUrl:meta.embedUrl,embedTall:meta.embedTall};
          return search(deep.title).then(function(rows){
            return {kind:"results",rows:rows,parsed:deep,caption:deep.caption,
                    author:meta.author,platform:meta.platform,
                    embedUrl:meta.embedUrl,embedTall:meta.embedTall};});
        });
      }).catch(function(e){
        if(e.message==="unsupported") return {kind:"unsupported"};
        // oEmbed itself failed (CORS, 401, whatever) — no caption came
        // back, but a straight TikTok/YouTube link still carries its own
        // video id, so the embed player can still work even though the
        // title-matching never got off the ground.
        var tt=/tiktok\.com/i.test(raw);
        var ttId=(raw.match(/\/video\/(\d+)/)||[])[1];
        var embedUrl = tt ? (ttId?"https://www.tiktok.com/embed/v2/"+ttId:null)
                     : (ytId(raw)?"https://www.youtube-nocookie.com/embed/"+ytId(raw):null);
        // A 404 means the video itself is gone — the description/audio
        // fallback would fail identically, no point trying. Every other
        // failure (embedding disabled, CORS, a timeout) still leaves a
        // fully public video the backend can read independently of oEmbed.
        var code=(e.message||"").split("|")[0];
        if(code==="notfound") return {kind:"oembedFail",err:e.message,embedUrl:embedUrl,embedTall:tt};
        return deepenTitle(raw,"").then(function(deep){
          if(!deep.title) return {kind:"oembedFail",err:e.message,embedUrl:embedUrl,embedTall:tt};
          return search(deep.title).then(function(rows){
            return {kind:"results",rows:rows,parsed:deep,caption:deep.caption,
                    embedUrl:embedUrl,embedTall:tt};});
        });
      })
    : search(raw).then(function(rows){
        return {kind:"results",rows:rows,parsed:{title:raw,chapter:null,confidence:"medium"}};});
  job.then(render).then(function(){
    if(!fromPost) return;
    postBack=fromPost;
    out.insertAdjacentHTML("afterbegin",
      '<button class="postback" id="postback">&larr; Back to the list</button>');
    document.getElementById("postback").onclick=function(){ render(fromPost); };
  }).catch(function(e){
    out.innerHTML='<div class="note bad"><p><strong>Error</strong>'+esc(e.message)+'</p></div>';
  }).then(function(){btn.disabled=false; setDiag("source: "+(sourceUsed||"-"));});
}

/* YouTube community posts ("youtube.com/post/<id>") aren't videos, so the
   video path can't read them. The server reads the post's text: a list
   of titles ("1. Chronicles of Runes 2. L.A.G ...") is shown as a list to
   pick from; anything else is read like a caption. */
var postBack=null;
function isYtPost(url){
  return /^https?:\/\/(www\.|m\.)?youtube\.com\/(post\/|(channel\/[^\/]+\/|@[^\/]+\/|c\/[^\/]+\/)?community\?(.*&)?lb=)/i.test(url);
}
function postLookup(url){
  var out=document.getElementById("out");
  if(out) out.innerHTML='<div class="spin">Reading the post…</div>';
  return fetchTimeout(API_BASE+"/api/post-lookup?url="+encodeURIComponent(url), null, 30000)
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok) throw new Error(d.detail||"Couldn't read that post right now.");
        return d;
      });
    })
    .then(function(d){
      if(d.titles && d.titles.length>1)
        return {kind:"postList", titles:d.titles, author:d.author||"", caption:d.text||""};
      var p=parseCaption(d.text||"");
      if(!p.title) return {kind:"noTitle", caption:d.text||""};
      return search(p.title).then(function(rows){
        return {kind:"results", rows:rows, parsed:p, caption:d.text||"",
                author:d.author||"", platform:"YouTube post"};
      });
    });
}
function postListHtml(r){
  return '<div class="note"><p><strong>This post lists '+r.titles.length+' titles</strong>'+
    'Tap one to find where to read it.</p></div>'+
    '<ol class="postlist">'+r.titles.map(function(t,i){
      return '<li><button data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+esc(t)+
        '<span class="go">Find &rsaquo;</span></button></li>';
    }).join("")+'</ol>';
}

/* The official player, offered wherever the caption alone came up short.
   Nothing here is proxied or downloaded -- it's the platform's own embed
   endpoint, loaded directly, so playback (audio included) happens entirely
   in their iframe. This exists because a caption can only tell us what
   the poster *typed*; plenty of edits say or show the title in the video
   itself instead, which no amount of text-parsing can ever read -- so
   this is the one honest way to get that name into the search box:
   watch or listen right here, then type what you catch. */
function watchHtml(r){
  if(!r.embedUrl) return "";
  return '<div class="watchwrap"><p>Some edits only say or show the title in the video '+
    'itself — watch or listen here, then type what you catch above.</p>'+
    '<div class="frame '+(r.embedTall?"tt":"yt")+'">'+
    '<iframe src="'+esc(r.embedUrl)+'" allow="autoplay; encrypted-media; picture-in-picture" '+
    'allowfullscreen loading="lazy" title="video"></iframe></div></div>';
}

function render(r){
  var out=document.getElementById("out");
  if(r.kind==="postList"){
    postBack=r;
    out.innerHTML=(r.author?'<div class="cap">YouTube post · '+esc(r.author)+'</div>':"")+postListHtml(r);
    Array.prototype.forEach.call(out.querySelectorAll(".postlist button"), function(b){
      b.onclick=function(){
        document.getElementById("q").value=r.titles[+b.getAttribute("data-i")];
        window.scrollTo(0,0);
        run();
      };
    });
    return;
  }
  if(r.kind==="unsupported"){
    out.innerHTML='<div class="note"><p><strong>Link not supported</strong>Only TikTok and '+
      'YouTube can be read. Type the manga name instead.</p></div>'; return;}
  if(r.kind==="oembedFail"){
