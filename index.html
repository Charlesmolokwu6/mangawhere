    var parts=(r.err||"").split("|");
    var code=parts[0], msg=parts[1]||r.err;
    var heading = code==="cors" ? "Caption blocked by the platform"
                : code==="notfound" ? "Video not found"
                : code==="embeddisabled" ? "Embedding turned off for this video"
                : "Couldn't read that video";
    // Every code but "notfound" already went through deepenTitle() before
    // landing here — the description and (for short clips) the audio
    // track were checked server-side and neither turned up a name either.
    out.innerHTML='<div class="note bad"><p><strong>'+heading+'</strong>'+esc(msg)+
      (code!=="notfound"
        ? " Checked its description and audio too, but couldn't find a name there either."
        : "")+'</p></div>'+
      // The embed player enforces the exact same restriction as oEmbed —
      // offering it here would just be a second, slower way to fail.
      (code==="embeddisabled" ? "" : watchHtml(r))+
      '<div class="note"><p><strong>Test the matching anyway</strong>'+
      'Copy the video\'s caption text and paste it here — everything after the caption '+
      'fetch is identical, so this still proves the parser and matcher work.</p></div>'+
      '<div class="paste"><input id="capin" placeholder="Paste the video caption text">'+
      '<button id="capgo">Parse</button></div><div id="capout"></div>';
    var ci=document.getElementById("capin");
    function capRun(){
      var text=ci.value.trim(); if(!text) return;
      var p=parseCaption(text);
      var co=document.getElementById("capout");
      co.innerHTML='<div class="cap">parsed &rarr; title: '+esc(p.title||"(none)")+
        ' · chapter: '+(p.chapter===null?"(none)":p.chapter)+
        ' · confidence: '+esc(p.confidence)+'</div>';
      if(!p.title){
        co.innerHTML+='<div class="note"><p><strong>No manga name in that caption</strong>'+
          'Type the name into the main box instead.</p></div>'; return;
      }
      co.innerHTML+='<div class="spin">Searching…</div>';
      search(p.title).then(function(rows){
        co.innerHTML='<div class="cap">parsed &rarr; title: '+esc(p.title)+
          ' · chapter: '+(p.chapter===null?"(none)":p.chapter)+'</div>';
        if(!rows.length){ co.innerHTML+='<div class="note"><p>No match for '+
          esc(p.title)+'.</p></div>'; return; }
        var sc=rows.map(function(m){return {m:m,s:score(m,p.title,text)};})
                   .sort(function(a,b){return b.s-a.s;});
        co.innerHTML+=detailHtml(sc[0].m,p.chapter);
        fillChapters(sc[0].m,p.chapter);
      }).catch(function(e){
        co.innerHTML='<div class="note bad"><p>'+esc(e.message)+'</p></div>';
      });
    }
    document.getElementById("capgo").onclick=capRun;
    ci.addEventListener("keydown",function(e){if(e.key==="Enter")capRun();});
    return;
  }
  if(r.kind==="noTitle"){
    out.innerHTML='<div class="cap">'+esc(r.caption)+'</div>'+watchHtml(r)+'<div class="note"><p>'+
      '<strong>No manga name found</strong>Checked the caption, description, and (for short '+
      'clips) the audio — none of them named it. Type it instead, guessing wrong is '+
      'worse than asking.</p></div>'; return;}
  var rows=r.rows||[];
  var head=r.caption
    ? '<div class="cap">'+(r.platform?esc(r.platform)+(r.author?" · @"+esc(r.author):"")+' &rarr; ':"")
      +esc(r.caption)+'</div>'
    : "";
  if(!rows.length){
    // Came from a link: the caption parsed into *something* (r.parsed.title),
    // it's just that nothing on Jikan/AniList matched it -- likely the
    // extracted title is wrong, not that the manga doesn't exist. Showing
    // the caption and what was searched for lets someone actually act on
    // that, instead of "try a shorter search" (which makes no sense when
    // you pasted a link, not typed a query).
    out.innerHTML=head+watchHtml(r)+'<div class="note"><p><strong>Nothing found for "'+
      esc(r.parsed.title)+'"</strong>'+(r.caption
        ? "That's what got pulled from the caption above — if it's wrong, type the real manga name instead."
        : "Try a shorter search — two or three words is usually enough, and the "+
          "suggestions appear as you type.")+
      '</p></div>'; return;}
  var scored=rows.map(function(m){return {m:m,s:score(m,r.parsed.title,r.caption||r.parsed.title)};})
                 .sort(function(a,b){return b.s-a.s;});
  var top=scored[0], next=scored[1]?scored[1].s:0;
  var sure=top.s>=.82 && (top.s-next)>=.08 && r.parsed.confidence!=="low";
  if(sure){ out.innerHTML=head+detailHtml(top.m,r.parsed.chapter);
            fillChapters(top.m,r.parsed.chapter); return; }
  var picks=scored.slice(0,5);
  out.innerHTML=head+'<div class="note"><p><strong>Which one is it?</strong>Not certain — '+
    'pick the right title.</p></div>'+
    picks.map(function(x,i){var m=x.m;
      return '<button class="pick" data-i="'+i+'">'+
        (m.cover?'<img loading="lazy" alt="" src="'+esc(m.cover)+'">':'<div class="ph"></div>')+
        '<div><h4>'+esc(m.title)+'</h4><p class="meta">'+esc(m.kind||"")+' · '+
        (m.chapters?m.chapters+" ch":"? ch")+' · '+esc(statusInfo(m.status).label)+'</p>'+
        '<p class="avail" id="pickavail-'+i+'">Checking if it\'s readable here…</p>'+
        '</div></button>';}).join("");
  var els=out.querySelectorAll(".pick");
  for(var i=0;i<els.length;i++)
    els[i].onclick=(function(m){return function(){
      out.innerHTML=head+detailHtml(m,r.parsed.chapter);
      fillChapters(m,r.parsed.chapter); window.scrollTo(0,0);};})(scored[+els[i].dataset.i].m);

  // Jikan/AniList/MangaDex only know the title exists — whether it's
  // actually scanned on one of our three reading sources is a separate,
  // heavier check (findChapters() does a real scrape). Checked once per
  // candidate actually shown here, not on every keystroke like the
  // type-ahead suggestions do.
  picks.forEach(function(x,i){
    findChapters(x.m.title, x.m.alts).then(function(res){
      var el=document.getElementById("pickavail-"+i);
      if(!el) return;   // picked already, or navigated away
      if(res.ok && (res.d.chapters||[]).length){
        el.textContent="✓ Available to read here";
        el.classList.add("ok");
      }else{
        el.textContent="Not available to read here yet";
      }
    });
  });
}

function showDetail(m,ch,solo){
  addRecent(m);
  stopRail();
  var tr=document.getElementById("trend"); if(tr) tr.style.display="none";
  // #out only exists on the home page. Opened from My list there is no
  // #out, so fall back to the app container rather than throwing.
  // `solo` means take over the whole screen — used for shared links, where
  // landing under the hero and the search box would bury the thing the
  // link was for.
  var host=(!solo && document.getElementById("out")) || document.getElementById("app");
  var from=curTab;
  host.innerHTML='<button class="back" id="bk">← Back</button>'+detailHtml(m,ch);
  fillChapters(m,ch);
  // Back should return where they came from, the way an app does.
  document.getElementById("bk").onclick=function(){
    // Drop ?m= so Back doesn't bounce straight back into this page.
    if(location.search.indexOf("m=")>-1 && history.replaceState){
      history.replaceState({}, "", location.pathname);
    }
    setTab(from);
  };
  window.scrollTo(0,0);
}

function detailHtml(m,videoCh){
  var st=statusInfo(m.status);
  var done = st.key==="complete";

  var behind=(videoCh&&m.chapters&&m.chapters>videoCh)
    ? '<p class="behind">'+(m.chapters-videoCh)+' more chapters out since that video</p>' : "";

  /* Third box changes with status, because the useful date changes too:
     for a finished series it's when it ended, for a running one it's how
     long it's been going. */
  var thirdK, thirdV;
  if(done && (m.ended||m.started)){
    thirdK="Ended"; thirdV=fmtDate(m.ended)||yearOf(m.ended)||"—";
  }else if(m.started){
    thirdK="Running since"; thirdV=fmtDate(m.started)||yearOf(m.started)||"—";
  }else{
    thirdK="Volumes"; thirdV=m.volumes||"—";
  }

  // Ongoing series have no count from AniList/MAL, so leave a slot that
  // the MangaUpdates lookup fills in a moment later. id/data-chapter stay
  // on the cell either way — reconcileChapterCount() needs somewhere to
  // correct this number later if the live scrape of the actual reading
  // source turns out to be further along.
  var chapCell = m.chapters
    ? '<div class="v" id="chapslot" data-chapter="'+m.chapters+'">'+m.chapters+'</div>'
    : '<div class="v sm" id="chapslot" data-chapter="">checking…</div>';

  // A completed series is a different proposition to an ongoing one, so
  // say it in words rather than making them read a status chip.
  var verdict;
  if(done){
    verdict='<p class="verdict done">Complete'+
      (m.chapters?' &middot; all '+m.chapters+' chapters are out':'')+
      (m.ended?' &middot; ended '+fmtDate(m.ended):'')+'. You can read the whole thing.</p>';
  }else if(st.key==="ongoing"){
    verdict='<p class="verdict live" id="verdictslot">Still running'+
      (m.chapters?' &middot; '+m.chapters+' chapters so far':'')+
      '. New chapters keep coming.</p>';
  }else if(st.key==="hiatus"){
    verdict='<p class="verdict warn">On hiatus &mdash; no new chapters for now.</p>';
  }else if(st.key==="cancelled"){
    verdict='<p class="verdict warn">Cancelled &mdash; it was never finished.</p>';
  }else{ verdict=""; }

  // updatedAt is when the listing changed, not when a chapter dropped.
  // Labelled honestly rather than dressed up as a release date.
  var freshness = "";

  return '<div class="card"><div class="hit">'+
    (m.cover?'<img alt="" src="'+esc(m.cover)+'" referrerpolicy="no-referrer">':'<div class="ph"></div>')+
    '<div><h2>'+esc(m.title)+'</h2><p class="meta" id="metaline">'+
    (m.kind?esc(m.kind)+" &middot; ":"")+
    '<span id="metachap">'+(m.chapters?m.chapters+" chapters":"chapter count unknown")+
    '</span></p>'+
    '<span class="pill '+esc(st.tone)+'">'+esc(st.label)+'</span>'+
    (m.kind?'<span class="pill kind">'+esc(m.kind)+'</span>':"")+
    (m.adult?'<span class="pill adult">18+</span>':"")+
    genrePills(m.genres)+'</div></div>'+
    synopsisBlock(m.synopsis)+
    verdict+
    '<div class="boxes">'+
    (videoCh?'<div><div class="k">Video was at</div><div class="v">'+videoCh+'</div></div>':"")+
    '<div><div class="k">'+(done?"Final chapter":"Latest out")+'</div>'+chapCell+'</div>'+
    '<div><div class="k">'+thirdK+'</div><div class="v sm">'+esc(String(thirdV))+'</div></div>'+
    '</div>'+behind+freshness+
    readerBox()+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
    '<button class="trackbtn'+(inList(m.id)?" on":"")+'" id="trackbtn" style="flex:1;margin-top:0">'+
      (inList(m.id)?"✓ Tracking":(signedIn()?"Track this":"Track this"))+'</button>'+
    shareRow(m)+
    '</div>'+
    '</div>'+
    adFrame(ADS.detailChapters)+
    '<h3>Chapters</h3>'+
    '<div id="detailchapters"><p class="sub" style="margin:0">Looking for a chapter list…</p></div>'+
    buyRow(m)+adSlot();
}

/* Called right after a detail card is painted. Fills the "Latest out"
   slot for ongoing series, where AniList and MAL have nothing. */
/* Someone arriving from a thirty-second recap has no idea what the story
   actually is. This is the first thing they should be able to read. */
function synopsisBlock(text){
  if(!text) return "";
  var short = text.length > 260;
  return '<div class="synop'+(short?" clamp":"")+'" id="synop">'+
    '<p>'+esc(text).replace(/\n/g,"<br>")+'</p>'+
    (short?'<button class="more" id="synmore">Read more</button>':"")+
    '</div>';
}

/* Genres come back in a different shape from each source, so both are
   normalised to plain strings before they get here. */
function genrePills(genres){
  var g=(genres||[]).filter(function(x){ return x && !/hentai|erotica/i.test(x); });
  if(!g.length) return "";
  return '<div class="gwrap">'+g.slice(0,6).map(function(x){
    return '<span class="pill genre">'+esc(x)+'</span>'; }).join("")+'</div>';
}

function wireSynopsis(){
  var b=document.getElementById("synmore");
  if(!b) return;
  b.onclick=function(){
    var box=document.getElementById("synop");
    var open=box.classList.toggle("clamp");
    b.textContent = open ? "Read more" : "Show less";
  };
}

function wireTrack(m, videoCh){
  var b=document.getElementById("trackbtn");
  if(!b) return;
  b.onclick=function(){
    // Browsing and searching stay open to everyone; saving is the point
    // where an account starts to mean something.
    if(!signedIn()){
      authView("signup", m);
      return;
    }
    if(inList(m.id)){
      removeFromList(m.id); syncUnwatch(m.id);
      b.className="trackbtn"; b.textContent="Track this";
      var n0=document.getElementById("pushnote"); if(n0) n0.remove();
      updateBadge();
      return;
    }
    // Remember the chapter they're on now, so "new" means new to them.
    var slot=document.getElementById("chapslot");
    var known=m.chapters || (slot? parseInt(slot.textContent,10) : null) || videoCh || null;
    addToList(m, known);
    b.className="trackbtn on"; b.textContent="✓ Tracking";
    updateBadge();

    // Then offer to actually reach them. Asking at this moment works
    // because they've just shown they care about this series — a
    // permission prompt on page load gets refused by almost everyone.
    enablePush().then(function(r){
      if(r.ok){ syncWatch(m, known); showPushNote(b, "on"); }
      else showPushNote(b, r.reason);
    });
  };
}

function showPushNote(btn, state){
  var old=document.getElementById("pushnote"); if(old) old.remove();
  var p=document.createElement("p");
  p.id="pushnote"; p.className="fresh";
  if(state==="on"){
    p.className="fresh authoritative";
    p.textContent="You'll get a notification when a new chapter is out.";
  }else if(state==="ios:add-to-home-screen"){
    p.textContent="For alerts on iPhone, tap Share then \"Add to Home Screen\" and "+
      "open it from there.";
  }else if(state==="no backend configured"){
    p.textContent="Saved to this device.";
  }else if(state==="blocked"){
    p.textContent="Notifications are blocked for this site. Tap the padlock in the "+
      "address bar to turn them on.";
  }else if(state==="dismissed"){
    p.textContent="Saved. Tap again if you'd like alerts for new chapters.";
  }else{
    p.textContent="Saved to this device.";
    console.log("[mangawhere] push unavailable:", state);
  }
  btn.parentNode.insertBefore(p, btn.nextSibling);
}

function fillChapters(m, videoCh){
  wireTrack(m, videoCh);
  wireShare(m);
  wireSynopsis();
  wireReader(m);

  // Start looking for a reading source now, not on Read tap — and once it
  // resolves, use its real, live chapter list to correct the "Latest
  // chapter" figure if the WEBTOON/MangaUpdates guess below (or AniList's
  // own count) turns out to be behind (a capped RSS feed, a stalled fan
  // translation, etc). Every path that opens a detail page routes through
  // here, so this is the one place this needs to be wired up.
  findChapters(m.title, m.alts).then(function(res){
    if(!res.ok) reportUnreadable(m);
    if(res.ok) reconcileChapterCount(res.d.chapters, res.d.domain);
    renderDetailChapters(m, res);
  });

  if(m.chapters) return;                  // count already known

  // Publisher first — it's authoritative. MangaUpdates only as fallback.
  webtoonLatest(m.links).then(function(pub){
    if(pub){ applyChapter(m, videoCh, {chapter:pub.chapter, updated:pub.updated,
             title:m.title, publisher:"WEBTOON"}); return null; }
    return muLatest(m.title).then(function(hit){ applyChapter(m, videoCh, hit); });
  });
}

function applyChapter(m, videoCh, hitPromise){
  Promise.resolve(hitPromise).then(function(hit){
    slot=document.getElementById("chapslot");
    if(!slot) return;                     // user navigated away
    if(hit && hit.fail){
      slot.className="v sm";
      slot.textContent="unavailable";
      slot.title="MangaUpdates: "+hit.fail;
      var card0=slot.closest(".card");
      if(card0 && !card0.querySelector(".mu-why")){
        var w=document.createElement("p");
        w.className="fresh mu-why";
        w.textContent = DEBUG
          ? ("Chapter count unavailable — "+hit.fail)
          : "No chapter count published for this one yet.";
        if(!DEBUG) console.log("[mangawhere] chapter lookup:", hit.fail);
        card0.appendChild(w);
        if(DEBUG && lastMuRaw){
          var pre=document.createElement("pre");
          pre.className="rawdump";
          pre.textContent=lastMuRaw;
          card0.appendChild(pre);
        }
      }
      return;
    }
    if(!hit || !hit.chapter){
      slot.className="v sm";
      slot.textContent="not published";
      slot.title="No source publishes a chapter count for this one yet.";
      return;
    }
    // findChapters()'s live scrape (see reconcileChapterCount()) can win
    // this race and already have posted a higher, more current number by
    // the time this resolves — a slow WEBTOON/MangaUpdates lookup landing
    // after it shouldn't drag the display back down to a stale one.
    var already=parseFloat(slot.dataset.chapter||"");
    var outclassed = !(hit.season>1) && !isNaN(already) && already>hit.chapter;

    slot.className="v";
    if(!outclassed){
      slot.innerHTML=(hit.season&&hit.season>1?'<span class="seasontag">S'+hit.season+'</span>':"")+
        hit.chapter+(hit.publisher?"":'<span class="approx">~</span>');
      slot.title="Latest chapter tracked by MangaUpdates"+
        (hit.alternates>1?" (highest of "+hit.alternates+" matching records)":"");
    }
    // Season numbering restarts per-season, so it isn't comparable to a
    // reading site's own (usually continuous) chapter count — leave that
    // reconciliation alone rather than have it clobber the season display.
    if(hit.season && hit.season>1) slot.dataset.season="1";
    else if(!outclassed) slot.dataset.chapter=hit.chapter;

    var cur=getList();
    var touched=false;
    cur.forEach(function(y){
      if(String(y.id)===String(m.id)){
        if(y.latest!==hit.chapter){ y.latest=hit.chapter; touched=true; }
        if(y.seen==null){ y.seen=hit.chapter; touched=true; }
      }
    });
    if(touched){ saveList(cur); }

    var mc=document.getElementById("metachap");
    if(mc && !outclassed) mc.textContent = (hit.season&&hit.season>1)
      ? ("season "+hit.season+", chapter "+hit.chapter)
      : (hit.chapter+" chapters");

    // Label the box honestly when the number is per-season.
    var box=slot.parentNode;
    if(box && hit.season && hit.season>1){
      var k0=box.querySelector(".k");
      if(k0) k0.textContent="Season "+hit.season+" chapter";
    }

    // Seasons run from separate records with their own numbering, so
    // list them — otherwise "chapter 24" looks like the series barely started.
    if(hit.seasons && hit.seasons.length>1){
      var card1=slot.closest(".card");
      if(card1 && !card1.querySelector(".seasons")){
        var sl=document.createElement("div");
        sl.className="seasons";
        sl.innerHTML='<div class="k" style="margin-bottom:6px">Seasons</div>'+
          hit.seasons.map(function(se){
            var cur=(se.n===hit.season);
            return '<span class="schip'+(cur?" on":"")+'">S'+se.n+' · '+se.chapter+
                   ' ch'+(se.completed?"":" ·")+(se.completed?"":" ongoing")+'</span>';
          }).join("");
        card1.appendChild(sl);
      }
    }

    var box=slot.parentNode;
    if(box && !outclassed){
      var k=box.querySelector(".k");
      if(k) k.textContent="Latest chapter";
    }
    var v=document.getElementById("verdictslot");
    if(v && !outclassed) v.innerHTML="Still running &middot; up to chapter "+hit.chapter+
      " so far. New chapters keep coming.";

    // If the video's chapter is behind, say how far — the single most
    // useful sentence on the page for someone who just watched a recap.
    if(videoCh && hit.chapter>videoCh){
      var card=slot.closest(".card");
      if(card && !card.querySelector(".behind")){
        var p=document.createElement("p");
        p.className="behind";
        p.textContent=(hit.chapter-videoCh)+" more chapters out since that video";
        card.appendChild(p);
      }
    }
    // Replace the vague AniList "last checked" line with the real one.
    var old=document.querySelector(".card .fresh");
    if(old && /last checked/i.test(old.textContent)) old.remove();

  });
}

var READER_SITE_LABEL={toongod:"ToonGod", asurascans:"Asura Scans", mangafreak:"MangaFreak",
  mangadex:"MangaDex", comizy:"Comizy", mangaread:"MangaRead", flamecomics:"Flame Comics",
  manhuaplus:"ManhuaPlus", kaliscan:"KaliScan", mangakatana:"MangaKatana", weebcentral:"WeebCentral"};

/* WEBTOON's RSS feed and MangaUpdates are both third-party guesses at
   how far a series has gotten, and both can lag behind: the RSS feed
   only ever lists a handful of recent episodes, and a MangaUpdates
   record stops updating the moment whoever was tracking it there stops.
   /api/find is different — it's a live scrape of the actual site
   "Read" is about to open, so its chapter list is the real, current
   one. Whenever it resolves with more chapters than what's already
   shown, that's the true "latest chapter" and should replace the guess. */
function reconcileChapterCount(chapters, domain){
  var top=0;
  (chapters||[]).forEach(function(c){ if(c.number>top) top=c.number; });
  if(!top) return;

  var slot=document.getElementById("chapslot");
  if(!slot || slot.dataset.season) return;   // navigated away, or season-numbered — leave that display alone

  var shown=parseFloat(slot.dataset.chapter||"");
  if(!isNaN(shown) && shown>=top) return;   // what's already shown is at least as current

  slot.dataset.chapter=top;
  slot.className="v";
  slot.textContent=top;
  slot.title="Latest chapter available on "+(READER_SITE_LABEL[domain]||"the reading source");

  var mc=document.getElementById("metachap");
  if(mc) mc.textContent=top+" chapters";

  var box=slot.parentNode;
  if(box){
    var k=box.querySelector(".k");
    if(k) k.textContent="Latest chapter";
  }
  var v=document.getElementById("verdictslot");
  if(v) v.innerHTML="Still running &middot; up to chapter "+top+" so far. New chapters keep coming.";

  // Whatever WEBTOON/MangaUpdates line was there no longer matches the
  // chapter number we just corrected — drop it rather than leave it
  // pointing at a chapter that isn't the latest one any more.
  var card=slot.closest(".card");
  if(card){
    var staleUpd=card.querySelector(".mu-upd");
    if(staleUpd) staleUpd.remove();
    var staleNote=card.querySelector(".mu-note");
    if(staleNote) staleNote.remove();
  }
}


/* Print volumes are the one thing a reader can buy that we can be paid
   for today — Amazon has a self-serve programme, unlike any of the manga
   platforms. It also points the same direction the reader is already
   going, so it costs no click-through. */
function buyRow(m){
  if(!AMAZON_TAG) return "";
  var q=encodeURIComponent(m.title+" manga");
  var url="https://www.amazon.com/s?k="+q+"&tag="+encodeURIComponent(AMAZON_TAG);
  return '<a class="read buy" target="_blank" rel="noopener sponsored" href="'+esc(url)+'">'+
    '<span><span class="n">Buy the volumes</span><br>'+
    '<span class="t">Print editions on Amazon</span></span>'+
    '<span class="go">Shop →</span></a>';
}

function adSlot(){ return adFrame(ADS.detail || AD_SLOT_HTML); }

/* One ad, sandboxed: allow-scripts without allow-same-origin gives the
   frame an opaque origin, so ad code can't read this page, its storage
   (where the sign-in token lives) or its cookies. Clicks still open the
   advertiser in a new tab. loading=lazy holds it back until it's near the
   screen, so ads never compete with chapter pages for bandwidth. */
/* The ad frame's opaque origin makes document.cookie and localStorage
   throw, and Adsterra's script reads the cookie first thing, so it died
   before drawing an ad. This gives the frame in-memory stand-ins: the
   network can keep its frequency-cap state for the life of the frame,
   and still can't reach this page's real storage or cookies. */
var AD_STORAGE_SHIM='<script>(function(){'+
  'try{document.cookie}catch(e){var jar={};Object.defineProperty(document,"cookie",{configurable:true,'+
    'get:function(){return Object.keys(jar).map(function(k){return k+"="+jar[k]}).join("; ")},'+
    'set:function(v){var p=String(v).split(";")[0],i=p.indexOf("=");if(i>0)jar[p.slice(0,i).trim()]=p.slice(i+1).trim()}})}'+
  'function mem(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},'+
    'setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},'+
    'key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}'+
  '["localStorage","sessionStorage"].forEach(function(n){try{window[n]}catch(e){'+
    'Object.defineProperty(window,n,{configurable:true,value:mem()})}})'+
  '})();<\/script>';

/* ?adtest=1 prints, inside each ad frame, what the network's script did:
   how many elements and frames it made and any error it threw. That tells
   "the network sent no ad" apart from "the sandbox broke its script". */
var AD_DEBUG=/[?&]adtest=1\b/.test(location.search);
var AD_DEBUG_HEAD='<script>window.__adErr=[];window.onerror=function(m){__adErr.push(m)};<\/script>';
var AD_DEBUG_TAIL='<script>setTimeout(function(){var d=document.createElement("pre");'+
  'd.style.cssText="position:absolute;top:0;left:0;margin:0;color:#fff;background:#000a;font:11px monospace;white-space:pre-wrap";'+
  'd.textContent="atOptions:"+typeof atOptions+" frames:"+document.querySelectorAll("iframe").length+'+
  '" elements:"+document.body.getElementsByTagName("*").length+" errors:"+(__adErr.join(" | ")||"none");'+
  'document.body.appendChild(d)},8000)<\/script>';

var AD_FRAME_START='<div class="adslot">'+
  '<iframe class="adframe" title="Advertisement" loading="lazy" scrolling="no" ';

/* A unit on AD_HOST. allow-same-origin only lets the frame keep its own
   (ad host) origin so its cookies work; it's still cross-origin to this
   page. Were AD_HOST ever served from this page's own origin, that flag
   would hand ad code this page's storage, so nothing is shown then. */
function hostedAdFrame(size){
  var host;
  try{ host=new URL(AD_HOST, location.href); }catch(e){ return ""; }
  if(host.origin===location.origin) return "";
  var wh=size.split("x");
  return AD_FRAME_START+
      'sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" '+
      'style="width:'+wh[0]+'px;height:'+wh[1]+'px" data-hosted onload="adHostLoaded(this)" '+
      'src="'+esc(host.href+"?unit="+size+(AD_DEBUG?"&debug=1":""))+'"></iframe></div>';
}

/* A second load means the frame left ad.html: an ad tried to redirect,
   the sandbox kept it inside the frame, and the advertiser's page
   (refusing to be framed) shows as Chrome's grey sad-face box. Put the
   ad page back once; if it happens again, hide the slot. */
function adHostLoaded(f){
  if(f._expected){ f._expected--; return; }  // ad.html's own retry
  f._loads=(f._loads||0)+1;
  if(f._loads<2) return;
  if(!f._reset){ f._reset=true; f._loads=0; f.src=f.getAttribute("src"); return; }
  var slot=f.closest(".adslot"); if(slot) slot.style.display="none";
}

// Every few seconds, credit on-screen time to each hosted ad frame and
// swap in a fresh ad once it has been seen for AD_REFRESH_SECONDS.
var AD_REFRESH_TICK=5;
setInterval(function(){
  if(!AD_REFRESH_SECONDS || document.visibilityState!=="visible") return;
  var every=Math.max(AD_REFRESH_SECONDS, 10);  // Adsterra's minimum
  var frames=document.querySelectorAll("iframe.adframe[data-hosted]");
  for(var i=0;i<frames.length;i++){
    var f=frames[i], r=f.getBoundingClientRect();
    if(!r.width || !r.height) continue;  // hidden slot
    var seenH=Math.min(r.bottom, innerHeight)-Math.max(r.top, 0);
    var seenW=Math.min(r.right, innerWidth)-Math.max(r.left, 0);
    if(seenH<=0 || seenW<=0 || seenH*seenW < r.width*r.height/2) continue;
    f._seen=(f._seen||0)+AD_REFRESH_TICK;
    if(f._seen<every) continue;
    f._seen=0; f._loads=0; f._reset=false;
    f.src=f.getAttribute("src");
  }
}, AD_REFRESH_TICK*1000);

// ad.html reports its own retry ("mw-ad-retry") and giving up
// ("mw-ad-empty"). Only messages from the ad host, and only about the
// frame that actually sent them, are acted on.
window.addEventListener("message", function(e){
  var hostOrigin;
  try{ hostOrigin=new URL(AD_HOST, location.href).origin; }catch(err){ return; }
  if(e.origin!==hostOrigin || (e.data!=="mw-ad-retry" && e.data!=="mw-ad-empty")) return;
  var frames=document.querySelectorAll("iframe.adframe");
  for(var i=0;i<frames.length;i++){
    if(frames[i].contentWindow!==e.source) continue;
    if(e.data==="mw-ad-retry") frames[i]._expected=(frames[i]._expected||0)+1;
    else { var slot=frames[i].closest(".adslot"); if(slot) slot.style.display="none"; }
  }
});

function adTop(code){
  var html=adFrame(code);
  return html ? '<div class="adtop">'+html+'</div>' : "";
}
function adFrame(code){
  if(!code) return "";
  // A list shows its ads together, one under the other.
  if(Array.isArray(code)) return '<div class="adgroup">'+code.map(adFrame).join("")+'</div>';
  if(AD_HOST && /^\d+x\d+$/.test(code)) return hostedAdFrame(code);
  var w=/['"]?width['"]?\s*:\s*(\d+)/.exec(code), h=/['"]?height['"]?\s*:\s*(\d+)/.exec(code);
  var width=w?parseInt(w[1],10):0, height=h?parseInt(h[1],10):AD_NATIVE_HEIGHT;
  // crossorigin lets onerror see the real message instead of "Script error."
  if(AD_DEBUG) code=AD_DEBUG_HEAD+code.replace(/<script src=/g,'<script crossorigin="anonymous" src=')+AD_DEBUG_TAIL;
  var doc='<!doctype html><html><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}'+
    'body{display:flex;justify-content:center}</style>'+AD_STORAGE_SHIM+'</head><body>'+code+'</body></html>';
  return AD_FRAME_START+
      'sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" '+
      'style="width:'+(width?Math.min(width, 2000)+'px':'100%')+';height:'+height+'px" '+
      'srcdoc="'+esc(doc)+'"></iframe></div>';
}

/* ================= reader (scraper-backed) =================
   No pasting: this searches every supported site by the manga's own
   title (server-side, via /api/find) and reads from whichever currently
   has the newer chapter. Whichever one wins hands back its full chapter
   list in the same response, so the chapter picker and Prev/Next are
   free from there — no extra round trip. Every other site that also has
   the title comes back as "alternates", which the reader falls back to
   when a chapter won't load from the winner (loadChapter()).

   Tapping into a title means reading it is the likely next step, so
   BOTH lookups this needs — which site (/api/find) and that site's
   actual chapter images (/api/scrape) — start the moment showDetail()
   paints, chained one after the other, rather than waiting for a tap on
   Read. By the time someone actually taps it, both are often already
   done and there's nothing left to wait on. Read/readerView() and the
   prefetch share the same two cache entries (by title, then by chapter
   URL), so whichever gets there first is what gets used; a failed
   lookup isn't cached, so retrying (tapping Read again, or opening the
   same title again) tries fresh instead of replaying a possibly-
   transient failure forever. */
var readerState={chapters:null, index:-1, back:null, domain:null, manga:null, alternates:[]};
var findCache={};
var scrapeCache={};

/* Sites list a series under different names, so the other names a title
   is known by go along too: the server tries them in turn when the main
   title isn't found. Only names with Latin letters, since no source
   indexes native-script titles. */
function altParams(alts){
  return (alts||[]).filter(function(a){ return a && /[A-Za-z]/.test(a); }).slice(0,3)
    .map(function(a){ return "&alt="+encodeURIComponent(a); }).join("");
}

function findChapters(title, alts){
  if(findCache[title]) return findCache[title];
  var promise=fetch(READER_BASE+"/api/find?title="+encodeURIComponent(title)+altParams(alts))
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, d:d}; }); })
    .catch(function(){ return {ok:false, status:0, d:null}; });
  findCache[title]=promise;
  promise.then(function(res){
    if(!res.ok){ delete findCache[title]; return; }
    // Found a source — start scraping its latest chapter's pages now
    // too, not just once Read is tapped.
    var chapters=res.d.chapters||[];
    if(chapters.length) scrapeChapter(chapters[chapters.length-1].url);
  });
  return promise;
}

function scrapeChapter(url){
  if(scrapeCache[url]) return scrapeCache[url];
  var promise=fetch(READER_BASE+"/api/scrape?url="+encodeURIComponent(url))
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .catch(function(){ return {ok:false, d:null}; });
  scrapeCache[url]=promise;
  promise.then(function(res){ if(!res.ok) delete scrapeCache[url]; });
  return promise;
}

function chapterLoaded(res){
  return res.ok && res.d && (res.d.images||[]).length>0;
}

/* Loads a chapter's pages, and if the current site fails (blocked, down,
   or just no pages for that chapter), tries the same chapter number on
   each alternate site in turn. The first that works becomes the reader's
   source from then on — its chapter list takes over the picker and
   Prev/Next — and the site that failed drops to the back of the
   alternates. Resolves with the working result plus `switchedTo` (the
   new site's domain) when it had to fall back. `exclude` lists sites
   already known not to work for this chapter (their images wouldn't
   load) — those are skipped outright, current site included. */
function loadChapter(url, exclude){
  exclude=exclude||[];
  var chapters=readerState.chapters, startIndex=readerState.index;
  var current=chapters&&chapters[startIndex];
  var first=exclude.indexOf(readerState.domain)>-1
    ? Promise.resolve({ok:false, d:null})
    : scrapeChapter(url);
  return first.then(function(res){
    if(chapterLoaded(res)) return res;
    if(!current || !(readerState.alternates||[]).length) return res;

    var alts=readerState.alternates.filter(function(a){ return exclude.indexOf(a.domain)<0; });
    function tryNext(i){
      if(i>=alts.length) return Promise.resolve(res);
      var alt=alts[i];
      var idx=(alt.chapters||[]).findIndex(function(c){ return c.number===current.number; });
      if(idx<0) return tryNext(i+1);
      return scrapeChapter(alt.chapters[idx].url).then(function(altRes){
        if(!chapterLoaded(altRes)) return tryNext(i+1);
        // They moved to another chapter while this was still trying —
        // don't swap the source out from under whatever they're reading now.
        if(readerState.chapters!==chapters || readerState.index!==startIndex) return altRes;
        var failed={domain:readerState.domain, series_url:null, chapters:readerState.chapters};
        readerState.alternates=readerState.alternates.filter(function(a){ return a!==alt; }).concat([failed]);
        readerState.chapters=alt.chapters;
        readerState.index=idx;
        readerState.domain=alt.domain;
        altRes.switchedTo=alt.domain;
        return altRes;
      });
    }
    return tryNext(0);
  });
}

/* Each scraped chapter carries its own site-supplied title (a subtitle,
   sometimes a release date, occasionally nothing but "Chapter N" again)
   — strip a leading "Chapter N" off it so the row isn't just repeating
   the number twice, and drop it entirely if nothing else was there. */
function chapterSubtitle(c){
  var t=(c.title||"").replace(/^chapter\s*[\d.]+\s*[-:.]?\s*/i,"").trim();
  return t||null;
}

/* The chapter list on a title's detail page — replaces what used to be a
   list of external "official" platform links. Those were often nothing
   more than a dead end (unlicensed titles, or a platform that doesn't
   actually carry it); this instead lists every chapter /api/find already
   found on the winning scanlation site, each one tappable straight into
   the reader. Shares the same findChapters() promise as the "Read"
   button and the prefetch, so this never re-fetches on its own. */
function renderDetailChapters(m, res){
  var box=document.getElementById("detailchapters");
  if(!box) return;   // navigated away before this resolved
  if(!res.ok){
    box.innerHTML='<div class="note"><p><strong>No chapter list yet</strong>'+
      (res.status===404
        ? "Couldn't find this title on any of the sites this app reads from."
        : "Couldn't load the chapter list right now — try again.")+'</p></div>';
    return;
  }
  var chapters=res.d.chapters||[];
  if(!chapters.length){
    box.innerHTML='<div class="note"><p><strong>No chapters yet</strong>'+
      'Nothing has been scanned for this title yet.</p></div>';
    return;
  }
  var back=function(){ showDetail(m, null); };
  var newestFirst=chapters.slice().reverse();

  // Every chapter, but scrollable within its own box rather than either
  // dumping all of a 200+ chapter series into the page's own scroll or
  // gating most of them behind a "show more" tap.
  box.innerHTML='<div style="max-height:420px;overflow-y:auto">'+
    newestFirst.map(function(c){
      var subtitle=chapterSubtitle(c);
      return '<button class="read chrow" data-url="'+esc(c.url)+'">'+
        '<span><span class="n">Chapter '+esc(String(c.number))+'</span>'+
        (subtitle?'<br><span class="t">'+esc(subtitle)+'</span>':'')+'</span>'+
        '<span class="go">Read →</span></button>';
    }).join("")+
  '</div>';
  Array.prototype.forEach.call(box.querySelectorAll(".chrow"), function(row){
    row.onclick=function(){
      var url=row.getAttribute("data-url");
      var idx=chapters.findIndex(function(c){ return c.url===url; });
      readerState={chapters:chapters, index:idx, back:back, manga:m,
        domain:res.d.domain, alternates:res.d.alternates||[]};
      readerView(url);
    };
  });
}

function readerBox(){
  return '<button class="primary" id="readergo" style="width:100%;margin-top:10px">Read</button>'+
    '<p class="err" id="readererr"></p>';
}

function wireReader(m){
  var go=document.getElementById("readergo");
  if(!go) return;
  var back=function(){ showDetail(m, null); };
  var label="Read";
  go.onclick=function(){
    var err=document.getElementById("readererr");
    err.textContent="";
    go.disabled=true; go.textContent="Finding…";

    findChapters(m.title, m.alts).then(function(res){
      go.disabled=false; go.textContent=label;
      if(!res.ok){
        err.textContent = res.status===404
          ? "Couldn't find this title to read."
          : "Couldn't load this right now — try again.";
        return;
      }
      var chapters=res.d.chapters||[];
      if(!chapters.length){
        err.textContent="Couldn't load this right now — try again.";
        return;
      }
      readerState={chapters:chapters, index:chapters.length-1, back:back, manga:m,
        domain:res.d.domain, alternates:res.d.alternates||[]};
      readerView(chapters[chapters.length-1].url);
    });
  };
}

/* The chapter-card dropdown, top-right of the reader. Renders from
   readerState.chapters — no fetch, /api/find already handed back every
   chapter on the winning site. Only one can be open at a time; a single
   document-level listener (armed once, below) closes it on an outside
   tap instead of each readerView() paint adding its own leaked listener. */
var openChapterDropdown=null;

document.addEventListener("click", function(e){
  if(!openChapterDropdown) return;
  var d=openChapterDropdown;
  if(!d.drop.contains(e.target) && e.target!==d.btn){
    d.drop.style.display="none";
    openChapterDropdown=null;
  }
});

function chapterPickerHtml(){
  var chapters=readerState.chapters, idx=readerState.index;
  var current=idx>-1?chapters[idx]:null;
  return '<div style="position:relative;flex-shrink:0">'+
    '<button class="linkish" id="rchapbtn" style="white-space:nowrap">'+
      (current?"Chapter "+esc(String(current.number)):"Chapters")+
      ' <span style="opacity:.6">▾</span>'+
    '</button>'+
    '<div id="rchapdrop" style="display:none;position:absolute;right:0;top:calc(100% + 6px);'+
      'max-height:320px;overflow-y:auto;background:var(--surf2);border:1px solid var(--line);'+
      'border-radius:12px;min-width:170px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35)"></div>'+
  '</div>';
}

function wireChapterPicker(){
  var btn=document.getElementById("rchapbtn"), drop=document.getElementById("rchapdrop");
  if(!btn||!drop) return;
  var chapters=readerState.chapters;

  btn.onclick=function(e){
    e.stopPropagation();
    if(openChapterDropdown){ drop.style.display="none"; openChapterDropdown=null; return; }

    var newestFirst=chapters.slice().reverse();
    drop.innerHTML=newestFirst.map(function(c){
      var active=chapters[readerState.index]===c;
      return '<button data-url="'+esc(c.url)+'" class="chrow" style="display:block;width:100%;'+
        'text-align:left;padding:11px 14px;border:0;border-bottom:1px solid rgba(127,127,127,.15);'+
        'background:'+(active?"rgba(61,231,195,.12)":"none")+';color:inherit;font:inherit;'+
        'font-size:14px;cursor:pointer">Chapter '+esc(String(c.number))+'</button>';
    }).join("");
    Array.prototype.forEach.call(drop.querySelectorAll(".chrow"), function(row){
      row.onclick=function(){
        var url=row.getAttribute("data-url");
        readerState.index=chapters.findIndex(function(c){ return c.url===url; });
        drop.style.display="none"; openChapterDropdown=null;
        readerView(url);
      };
    });
    drop.style.display="block";
    openChapterDropdown={btn:btn, drop:drop};
  };
}

/* The Prev/Next bar at the end of a chapter's pages. */
function renderReaderNav(){
  var chapters=readerState.chapters, idx=readerState.index;
  var html="";
  if(chapters && idx>-1){
    var prev=chapters[idx-1], next=chapters[idx+1];
    if(prev||next){
      html='<div style="display:flex;gap:8px;margin:16px 0">'+
        (prev?'<button class="trackbtn rprev" style="flex:1;margin-top:0;'+
          'background:var(--surf2);color:var(--text);border:1px solid var(--line)">‹ Prev</button>':'')+
        (next?'<button class="trackbtn rnext" style="flex:1;margin-top:0">Next ›</button>':'')+
      '</div>';
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".readernavslot"), function(el){
    el.innerHTML=html;
    var p=el.querySelector(".rprev"), n=el.querySelector(".rnext");
    if(p) p.onclick=function(){ readerState.index=idx-1; readerView(chapters[idx-1].url); };
    if(n) n.onclick=function(){ readerState.index=idx+1; readerView(chapters[idx+1].url); };
  });
}

/* Full-page reader: fetches the chapter's image URLs through the backend
   (so the site's own anti-hotlinking / Cloudflare handling happens
   server-side) and stacks them the way a webtoon reader would. The
   chapter picker and Prev/Next come from readerState, set by whoever
   found/navigated here. */
var readerLoadToken=0;

function readerView(url, exclude){
  var token=++readerLoadToken;
  stopNarration();
  stopRail();
  enterReaderChrome();
  openChapterDropdown=null;
  var view=document.getElementById("app");
  var hasChapters=!!readerState.chapters;
  view.innerHTML=adTop(ADS.readerTop)+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
      '<button class="back" id="rbk" style="margin:0">← Back</button>'+
      (hasChapters?chapterPickerHtml():'')+
    '</div>'+
    '<p class="sub" id="rstatus">Loading…</p>'+
    '<div id="rpages"></div>'+
    '<div id="radend"></div>'+
    '<div class="readernavslot"></div>'+
    commentsHtml()+
    recommendationsHtml();
  document.getElementById("rbk").onclick=readerState.back;
  if(hasChapters) wireChapterPicker();
  window.scrollTo(0,0);
  renderReaderNav();
  wireComments();
  loadRecommendations();

  loadChapter(url, exclude).then(function(res){
    var status=document.getElementById("rstatus");
    // Navigated away, or on to another chapter, before this resolved.
    if(!status || token!==readerLoadToken) return;
    if(!res.ok){
      status.textContent="Couldn't load this chapter — try again.";
      reportUnreadable(readerState.manga);
      return;
    }
    var images=res.d.images||[];
    if(!images.length){
      status.textContent="Couldn't load this chapter — try again.";
      reportUnreadable(readerState.manga);
      return;
    }
    status.textContent="";   // loaded fine — no page count to show
    if(res.switchedTo){
      // The picker and Prev/Next were drawn from the site that failed —
      // redraw them from the one that actually worked.
      status.textContent="Couldn’t load it from the first site, so this is from "+
        (READER_SITE_LABEL[res.switchedTo]||res.switchedTo)+".";
      var picker=document.getElementById("rchapbtn");
      if(picker) picker.parentNode.outerHTML=chapterPickerHtml();
      wireChapterPicker();
      renderReaderNav();
    }
    document.getElementById("rpages").innerHTML=images.map(function(src, i){
      // The first few pages load straight away, at high priority. The rest
      // wait until the reader scrolls near them — they hold a placeholder
      // height until loaded, since an image with no height yet counts as
      // "in view", and a ~200-image chapter would otherwise request every
      // page at once, with page 1 queued behind page 150.
      var attrs=i<EAGER_PAGES ? 'fetchpriority="high"' : 'loading="lazy"';
      var page='<img '+attrs+' class="rpage" decoding="async" '+
        'src="'+esc(pageSrc(src))+'" referrerpolicy="no-referrer" alt="">';
      // An ad after every AD_EVERY_PAGES pages — but not after the last
      // page, where readerEnd already sits.
      if((i+1)%AD_EVERY_PAGES===0 && i<images.length-1) page+=adFrame(ADS.readerPages);
      return page;
    }).join("");
    document.getElementById("radend").innerHTML=adFrame(ADS.readerEnd);
    Array.prototype.forEach.call(document.querySelectorAll("#rpages .rpage"), function(img){
      var done=function(){ img.classList.add("loaded"); };
      if(img.complete && img.naturalWidth) done();
      else img.addEventListener("load", done, {once:true});
      retryPage(img);
    });
    prefetchNextChapter();
    watchFirstPage(token, exclude);
    var shown=readerState.chapters&&readerState.chapters[readerState.index];
    mountNarration(shown?shown.url:url, token);
  });
}

/* ================= storyteller (chapter narration) =================
   A floating "Listen" button in the reader. The backend (server/
   storyteller.py) reads each page's speech bubbles with OCR, optionally
   has a local AI model narrate them, and records an MP3 with a free
   open-source Kokoro voice the listener picks. That takes minutes, so it
   runs as a job this polls. Only
   shown when the backend says narration is set up (/api/config). */
var narrationConfig=null;
var narration={audio:null, timer:null};

/* Narration may run on a different server from the reader (a machine
   with more memory — see NARRATION_URL in README.md). When it does, this
   server's config just points there ("base"), and that server is asked
   what it can actually do. Every narration request then goes to `base`. */
function readNarrationConfig(base){
  return fetch(base+"/api/config").then(function(r){ return r.json(); })
    .then(function(cfg){
      return Object.assign({available:false}, cfg.narration, {phone:!!cfg.phone_narration});
    });
}

function getNarrationConfig(){
  if(!narrationConfig){
    narrationConfig=readNarrationConfig(READER_BASE)
      .then(function(n){
        if(!n.available || !n.base) return Object.assign({}, n, {base:READER_BASE});
        var remote=n.base.replace(/\/$/,"");
        return readNarrationConfig(remote).then(function(r){
          return r.base ? {available:false, phone:n.phone} : Object.assign({}, r, {base:remote});   // no chains
        }, function(){ return {available:false, phone:n.phone}; });
      })
      .catch(function(){ narrationConfig=null; return {available:false}; });
  }
  return narrationConfig;
}

function stopNarration(){
  stopPhoneNarration();
  if(phonePlayer){
    (phonePlayer.workers||[]).forEach(function(w){ w.terminate(); });
    phonePlayer=null;
  }
  if(narration.timer){ clearTimeout(narration.timer); narration.timer=null; }
  if(narration.audio){ narration.audio.pause(); narration.audio=null; }
  var old=document.getElementById("narr");
  if(old) old.remove();
}

/* Listeners pick their narrator; the choice is remembered on this device
   for next time. Voices come from the narration server's own list. */
var VOICE_KEY="mw-narration-voice";
function rememberVoice(v){ try{ localStorage.setItem(VOICE_KEY, v); }catch(e){} }
function voiceOptions(cfg){
  var voices=cfg.voices||[], saved=null;
  try{ saved=localStorage.getItem(VOICE_KEY); }catch(e){}
  var chosen=voices.some(function(v){ return v.id===saved; }) ? saved : cfg.default_voice;
  return voices.map(function(v){
    return '<option value="'+esc(v.id)+'"'+(v.id===chosen?' selected':'')+'>'+esc(v.name)+'</option>';
  }).join("");
}

var NARRATION_STAGE={queued:"Waiting in line…", reading:"Reading the pages", writing:"Choosing how each line is said",
  speaking:"Recording the voice…", done:"Ready", error:"Failed"};

function mountNarration(chapterUrl, token){
  getNarrationConfig().then(function(cfg){
    if(token!==readerLoadToken || document.getElementById("narr")) return;
    if(!cfg.available){
      if(cfg.phone && phoneNarrationSupported()) mountPhoneNarration(chapterUrl, token);
      return;
    }
    var box=document.createElement("div");
    box.className="narr"; box.id="narr";
    box.innerHTML='<div class="narr-panel" hidden></div>'+
      '<button class="narr-fab" aria-label="Listen to this chapter">🎧 Listen</button>';
    document.body.appendChild(box);
    var panel=box.querySelector(".narr-panel"), fab=box.querySelector(".narr-fab");
    var how=cfg.storyteller
      ? "Reads the dialogue aloud, with a local AI choosing how each line is said."
      : "Reads the chapter’s dialogue aloud with a free voice.";
    panel.innerHTML='<h4>Storyteller mode <button aria-label="Close">×</button></h4>'+
      '<p class="sub">'+how+' Takes a few minutes the first time.</p>'+
      '<select aria-label="Voice">'+voiceOptions(cfg)+'</select>'+
      '<button class="go">Narrate this chapter</button>'+
      '<div class="narr-status"></div>';
    panel.querySelector("h4 button").onclick=function(){ panel.hidden=true; fab.hidden=false; };
    fab.onclick=function(){ panel.hidden=false; fab.hidden=true; };
    panel.querySelector(".go").onclick=function(){
      var voice=panel.querySelector("select").value;
      rememberVoice(voice);
      panel.querySelector("select").disabled=true;
      this.hidden=true;
      startNarration(cfg.base, chapterUrl, voice, panel.querySelector(".narr-status"), token);
    };
  });
}

function renderNarrationStatus(el, job){
  if(job.state==="error"){
    el.innerHTML='<p class="err">'+esc(job.error||"Narration failed.")+'</p>';
    return;
  }
  var pct=job.total?Math.round(100*job.done/job.total):0;
  var label=NARRATION_STAGE[job.state]||job.state;
  if(job.state==="reading" && job.total) label+=" — "+job.done+" of "+job.total+" pages";
  if(job.state==="writing" && job.total) label+=" — "+job.done+" of "+job.total+" lines";
  el.innerHTML='<div class="narr-bar"><i style="width:'+(job.state==="speaking"?100:pct)+'%"></i></div>'+
    '<p class="sub" style="margin:0">'+esc(label)+'</p>';
}

function startNarration(base, chapterUrl, voice, el, token){
  el.innerHTML='<p class="sub" style="margin:0">Starting…</p>';
  fetch(base+"/api/narrate",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chapter_url:chapterUrl, voice:voice})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if(token!==readerLoadToken) return;
      if(!res.ok){ renderNarrationStatus(el, {state:"error", error:res.d.detail}); return; }
      pollNarration(base, res.d, el, token);
    })
    .catch(function(){ renderNarrationStatus(el, {state:"error", error:"Couldn’t reach the server — try again."}); });
}

function pollNarration(base, job, el, token){
  if(token!==readerLoadToken) return;
  if(job.state==="done"){
    el.innerHTML='<p class="sub" style="margin:0">'+(job.mode==="storyteller"?"AI storyteller":"Dialogue read-aloud")+'</p>'+
      '<audio controls preload="auto" src="'+esc(base+"/api/narrate/"+job.job+"/audio")+'"></audio>';
    narration.audio=el.querySelector("audio");
    narration.audio.play().catch(function(){});   // autoplay can be blocked; the controls are right there
    return;
  }
  renderNarrationStatus(el, job);
  if(job.state==="error") return;
  narration.timer=setTimeout(function(){
    fetch(base+"/api/narrate/"+job.job).then(function(r){ return r.json(); })
      .then(function(next){ pollNarration(base, next, el, token); })
      .catch(function(){ pollNarration(base, job, el, token); });
  }, 2500);
}

/* ---- storyteller mode on the phone ----
   Where the server can't narrate (Render's free plan; see README), the
   listener's own phone does it: ocr-worker.js reads each page's speech
   bubbles, /api/narrate/lines tidies the text (milliseconds of work for
   the server), and the phone's built-in voice reads it aloud while the
   page scrolls along with it.

   The player is one round button: headphones to start, pause while it
   reads (with a pulse to show it's live), play while paused. Next to it,
   voice settings and stop. The text reader starts loading as soon as a
   chapter opens, so a tap starts reading at once. */
var PHONE_VOICE_KEY="mw-phone-voice", PHONE_RATE_KEY="mw-phone-rate";
var PHONE_READ_AHEAD=2;   // pages read ahead of the one being spoken
/* Lines arrive a slice of the page at a time; ones this close (in page
   pixels) to how far down the page has been read wait for the next slice,
   since the rest of their speech bubble may be just below. */
var PHONE_HOLD_PX=300, PHONE_BUBBLE_GAP=80;   // lines in one bubble sit closer than this
/* Optional: the address of cloudflare/page-cache-worker.js once deployed
   (e.g. "https://mangawhere-pages.NAME.workers.dev"). Cloudflare then
   keeps each page it hands out, so Render sends a page once rather than
   once per listener. Empty: pages come straight from READER_BASE. */
var NARRATION_PAGE_BASE="https://mangawhere-pages.pineapplegodfather.workers.dev";
// One of the files ocr-worker.js keeps after its first download: if it's
// there, warming the reader up costs no data.
var PHONE_OCR_PROBE="https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ch_PP-OCRv4_det_infer.onnx";
var PHONE_USER_SCROLL_MS=8000;   // after the reader scrolls themselves, don't pull the page back for this long
var phoneNarr=null, phonePlayer=null;

var PHONE_ICONS={
  idle:'<svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>',
  playing:'<svg viewBox="0 0 24 24"><rect class="fill" x="6" y="4.5" width="4" height="15" rx="1.2"/><rect class="fill" x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>',
  paused:'<svg viewBox="0 0 24 24"><path class="fill" d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8z"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};
PHONE_ICONS.loading=PHONE_ICONS.idle;
var PHONE_FAB_LABEL={idle:"Listen to this chapter", loading:"Getting ready — tap to pause",
  playing:"Pause", paused:"Resume"};

function phoneNarrationSupported(){
  return typeof Worker!=="undefined" && typeof OffscreenCanvas!=="undefined" &&
    typeof createImageBitmap!=="undefined" && typeof WebAssembly!=="undefined" &&
    "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
}

// ---- voices: a male voice unless the listener picked another ----------------
var PHONE_MALE_NAME=/\b(male|man|guy|david|mark|daniel|alex|fred|tom|oliver|arthur|aaron|rishi|james|george|ryan|eric|brian|matthew|christopher|roger|andrew|thomas|paul|jacob|kevin)\b/i;
// Android's Google voices are named by code rather than gender.
var PHONE_MALE_CODE=/en-(us|gb)-x-(iom|tpd|rjs|gbd)/i;
function isMaleVoice(v){ return PHONE_MALE_NAME.test(v.name) || PHONE_MALE_CODE.test(v.voiceURI+" "+v.name); }

function englishVoices(){
  var all=window.speechSynthesis.getVoices()||[];
  var en=all.filter(function(v){ return /^en([-_]|$)/i.test(v.lang); });
  return (en.length?en:all).slice().sort(function(a,b){ return isMaleVoice(b)-isMaleVoice(a); });
}
function savedPhoneSetting(key, fallback){
  try{ return localStorage.getItem(key)||fallback; }catch(e){ return fallback; }
}
// The voice to use: the one picked in settings, else a male one, else the
// phone's default spoken a little deeper.
function phoneVoice(){
  var voices=englishVoices(), saved=savedPhoneSetting(PHONE_VOICE_KEY, "");
  var picked=voices.filter(function(v){ return v.voiceURI===saved; })[0];
  if(picked) return {voice:picked, pitch:1};
  var male=voices.filter(isMaleVoice);
  var local=male.filter(function(v){ return v.localService; });
  if(male.length) return {voice:(local[0]||male[0]), pitch:1};
  return {voice:voices.filter(function(v){ return v.default; })[0]||voices[0]||null, pitch:0.8};
}
function phoneVoiceOptions(){
  var voices=englishVoices(), current=phoneVoice().voice;
  if(!voices.length) return '<option value="">Phone’s own voice</option>';
  return voices.map(function(v){
    return '<option value="'+esc(v.voiceURI)+'"'+(current&&v.voiceURI===current.voiceURI?' selected':'')+'>'+
      esc(v.name)+(isMaleVoice(v)?" (male)":"")+'</option>';
  }).join("");
}
function phoneRateOptions(){
  var saved=savedPhoneSetting(PHONE_RATE_KEY, "1");
  return [["0.85","Slower"],["1","Normal speed"],["1.15","Faster"],["1.3","Fastest"]].map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===saved?' selected':'')+'>'+o[1]+'</option>';
  }).join("");
}

// ---- the player ---------------------------------------------------------------
function mountPhoneNarration(chapterUrl, token){
  var box=document.createElement("div");
  box.className="narr"; box.id="narr";
  box.innerHTML=
    '<div class="narr-sheet" hidden>'+
      '<h4>Voice <button class="narr-done" aria-label="Close">×</button></h4>'+
      '<select class="pv" aria-label="Voice">'+phoneVoiceOptions()+'</select>'+
      '<select class="pr" aria-label="Speed">'+phoneRateOptions()+'</select>'+
      '<p class="sub">Your phone’s own voices. More can be added in its text-to-speech settings.</p>'+
    '</div>'+
    '<div class="narr-cap" hidden aria-live="polite"><small></small><span></span></div>'+
    '<div class="narr-btns">'+
      '<button class="narr-mini narr-set" aria-label="Voice settings">'+PHONE_ICONS.settings+'</button>'+
      '<button class="narr-mini narr-x" aria-label="Stop reading" hidden>'+PHONE_ICONS.stop+'</button>'+
      '<button class="narr-play"></button>'+
    '</div>';
  document.body.appendChild(box);
  var player=phonePlayer={box:box, chapterUrl:chapterUrl, token:token, workers:null,
    fab:box.querySelector(".narr-play"), cap:box.querySelector(".narr-cap"), sheet:box.querySelector(".narr-sheet")};
  setPhoneFab(player, "idle");
  // Phones list their voices a moment after the page loads.
  window.speechSynthesis.onvoiceschanged=function(){
    var sel=player.sheet.querySelector(".pv"); if(sel) sel.innerHTML=phoneVoiceOptions();
  };
  player.sheet.querySelector(".pv").onchange=function(){
    try{ localStorage.setItem(PHONE_VOICE_KEY, this.value); }catch(e){}
  };
  player.sheet.querySelector(".pr").onchange=function(){
    try{ localStorage.setItem(PHONE_RATE_KEY, this.value); }catch(e){}
  };
  player.sheet.querySelector(".narr-done").onclick=function(){ player.sheet.hidden=true; };
  box.querySelector(".narr-set").onclick=function(){ player.sheet.hidden=!player.sheet.hidden; };
  box.querySelector(".narr-x").onclick=function(){ if(phoneNarr) endPhoneNarration(phoneNarr, ""); };
  player.fab.onclick=function(){
    var st=phoneNarr;
    if(!st) startPhoneNarration(player);
    else togglePhonePause(st);
  };
  warmPhoneReader(player);
}

function setPhoneFab(player, state){
  player.fab.setAttribute("data-state", state);
  player.fab.setAttribute("aria-label", PHONE_FAB_LABEL[state]);
  player.fab.innerHTML=PHONE_ICONS[state];
  player.box.querySelector(".narr-x").hidden=(state==="idle");
}

/* Start the text reader loading as soon as the chapter opens, so a tap
   starts reading at once. Free when it's already on the phone; the first
   download (~17MB) waits for the tap on mobile data or data saver. */
function warmPhoneReader(player){
  var conn=navigator.connection;
  var cached=window.caches
    ? caches.open("mw-ocr-v1").then(function(c){ return c.match(PHONE_OCR_PROBE); }).then(Boolean, function(){ return false; })
    : Promise.resolve(false);
  cached.then(function(isCached){
    if(phonePlayer!==player || player.workers || phoneNarr) return;
    if(!isCached && conn && (conn.saveData || conn.type==="cellular")) return;
    player.workers=newOcrWorkers();
  });
}

function newOcrWorkers(){
  var n=(navigator.hardwareConcurrency||2)>=6 ? 2 : 1, workers=[];   // two pages at once on faster phones
  for(var i=0;i<n;i++){
    var w=new Worker("ocr-worker.js");
    w.page=-1;
    w.postMessage({type:"init"});
    workers.push(w);
  }
  return workers;
}

function startPhoneNarration(player){
  stopPhoneNarration();
  player.sheet.hidden=true;
  var total=document.querySelectorAll("#rpages .rpage").length;
  if(!total){ showPhoneCaption(player, "", "This chapter’s pages haven’t loaded yet."); return; }
  var st=phoneNarr={player:player, chapterUrl:player.chapterUrl, total:total,
    pages:[], next:0, cur:0, line:0, workers:player.workers||newOcrWorkers(),
    talking:false, paused:false, stopped:false, errors:0, read:0, watchdog:null, userUntil:0};
  player.workers=null;
  st.workers.forEach(function(w){ bindOcrWorker(st, w); });
  // Leave the page alone for a while after the reader scrolls it themselves.
  st.onUser=function(){ st.userUntil=Date.now()+PHONE_USER_SCROLL_MS; };
  ["touchstart","wheel","keydown"].forEach(function(ev){ window.addEventListener(ev, st.onUser, {passive:true}); });
  showPhoneTopAd(st);
  setPhoneFab(player, "loading");
  showPhoneCaption(player, "Storyteller mode", "Getting the first page ready…");
  // Some phones only allow speech that a tap started, so the voice starts
  // now, while the first page is still being read.
  st.talking=true;
  speakPhoneLine(st, {text:"Storyteller mode.", delivery:"says"}, function(){
    st.talking=false; speakNextPhoneLine(st);
  });
  feedOcrWorkers(st);
}

function bindOcrWorker(st, w){
  w.onmessage=function(e){
    var m=e.data||{};
    if(st.stopped) return;
    if(m.type==="progress"){ if(!st.read) showPhoneCaption(st.player, "Storyteller mode", m.label); return; }
    if(m.type==="lines"){ st.read++; phonePageLines(st, m.id, m.lines||[], m.frontier, m.last); return; }
    if(m.type!=="result" && m.type!=="error") return;
    if(m.type==="error" && w.page<0) return;   // the warm-up's own failure; the first page will retry
    var page=w.page; w.page=-1;
    if(m.type==="error"){
      st.errors++;
      // Nothing read and pages keep failing: the reader itself didn't load.
      if(!st.read && st.errors>=2){
        endPhoneNarration(st, "Couldn’t start the text reader: "+(m.message||"unknown error")); return;
      }
      phonePageLines(st, page, [], 0, true);   // skip what's left of it
    }
    feedOcrWorkers(st);
  };
  w.onerror=function(){ if(!st.stopped && !st.read) endPhoneNarration(st, "This browser couldn’t start the text reader."); };
}

function feedOcrWorkers(st){
  st.workers.forEach(function(w){
    if(st.stopped || w.page>=0 || st.next>=st.total || st.next-st.cur>PHONE_READ_AHEAD) return;
    var page=st.next++;
    w.page=page;
    w.postMessage({type:"ocr", id:page, url:(NARRATION_PAGE_BASE||READER_BASE)+"/api/narrate/page?chapter_url="+
      encodeURIComponent(st.chapterUrl)+"&n="+page});
  });
}

/* A slice's worth of a page's lines. Those safely above how far the page
   has been read go to be tidied and spoken now; tidying is chained so a
   page's lines are always spoken in order. */
function phonePageLines(st, n, lines, frontier, last){
  var page=st.pages[n]||(st.pages[n]={lines:[], held:[], done:false, chain:Promise.resolve()});
  var held=page.held.concat(lines), limit=last ? Infinity : frontier-PHONE_HOLD_PX;
  var ready=held.filter(function(l){ return l[0][2][1]<limit; });
  var wait=held.filter(function(l){ return l[0][2][1]>=limit; });
  // Never split a bubble: a line ending within PHONE_BUBBLE_GAP of one
  // that's waiting may be part of it, so it waits too.
  for(var moved=true; moved && wait.length;){
    var top=Math.min.apply(null, wait.map(function(l){ return l[0][0][1]; }));
    moved=false;
    ready=ready.filter(function(l){
      if(l[0][2][1] > top-PHONE_BUBBLE_GAP){ wait.push(l); moved=true; return false; }
      return true;
    });
  }
  page.held=wait;
  if(ready.length) page.chain=page.chain.then(function(){ return tidyPhoneLines(ready); }).then(function(spoken){
    page.lines=page.lines.concat(spoken);
    if(st.cur===n) speakNextPhoneLine(st);
  });
  if(last) page.chain=page.chain.then(function(){
    page.done=true;
    if(st.cur===n) speakNextPhoneLine(st);
  });
}

function tidyPhoneLines(lines){
  return fetch(READER_BASE+"/api/narrate/lines",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lines:lines})})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){ return d.lines||[]; })
    // Server unreachable: the raw text is better than skipping the lines.
    .catch(function(){ return lines.map(function(l){ return {text:l[1], delivery:"says", y:l[0][0][1]}; }); });
}

function speakNextPhoneLine(st){
  if(st.stopped || st.paused || st.talking) return;
  if(st.cur>=st.total){ endPhoneNarration(st, "Finished this chapter."); return; }
  var page=st.pages[st.cur];
  if(!page || (st.line>=page.lines.length && !page.done)){
    setPhoneFab(st.player, "loading");
    showPhoneCaption(st.player, "Page "+(st.cur+1)+" of "+st.total, "Reading the page…");
    return;
  }
  if(st.line>=page.lines.length){
    st.cur++; st.line=0;
    feedOcrWorkers(st);
    speakNextPhoneLine(st);
    return;
  }
  var item=page.lines[st.line++];
  followPhoneLine(st, st.cur, item.y);
  setPhoneFab(st.player, "playing");
  showPhoneCaption(st.player, "Page "+(st.cur+1)+" of "+st.total, item.text);
  st.talking=true;
  speakPhoneLine(st, item, function(){ st.talking=false; speakNextPhoneLine(st); });
}

function speakPhoneLine(st, item, onend){
  var u=new SpeechSynthesisUtterance(item.text), v=phoneVoice();
  u.lang="en-US";
  if(v.voice){ try{ u.voice=v.voice; u.lang=v.voice.lang; }catch(e){} }
  var rate=parseFloat(savedPhoneSetting(PHONE_RATE_KEY, "1"))||1, pitch=v.pitch, volume=1;
  if(item.delivery==="shouts"){ rate*=1.06; pitch*=1.12; }
  else if(item.delivery==="asks"){ pitch*=1.06; }
  else if(item.delivery==="mutters"||item.delivery==="whispers"){ rate*=0.92; pitch*=0.92; volume=0.85; }
  u.rate=rate; u.pitch=pitch; u.volume=volume;
  var finished=false;
  function end(){
    if(finished) return;
    finished=true; clearTimeout(st.watchdog);
    if(!st.stopped) onend();
  }
  u.onend=end; u.onerror=end;
  // Some phones never report the end of a line; don't let that stall the chapter.
  st.watchdog=setTimeout(end, 4000+item.text.length*120/rate);
  window.speechSynthesis.speak(u);
}

// Pausing cancels the line being spoken (phones' own pause is unreliable)
// and says it again on resume.
function togglePhonePause(st){
  if(st.stopped) return;
  st.paused=!st.paused;
  if(st.paused){
    if(st.talking && st.line>0) st.line--;
    window.speechSynthesis.cancel();
    setPhoneFab(st.player, "paused");
    showPhoneCaption(st.player, "Paused", "Tap play to carry on.");
  } else {
    setPhoneFab(st.player, "playing");
    speakNextPhoneLine(st);
  }
}

/* Keep the bubble being read in view: about a third of the way down the
   screen, below the pinned ad. Not while the reader is scrolling. */
function followPhoneLine(st, n, y){
  if(Date.now()<st.userUntil) return;
  var img=document.querySelectorAll("#rpages .rpage")[n];
  if(!img) return;
  var r=img.getBoundingClientRect();
  if(typeof y!=="number" || !img.naturalHeight){
    if(r.bottom<0 || r.top>window.innerHeight) img.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  var target=window.scrollY+r.top+y*(r.height/img.naturalHeight)-window.innerHeight*0.33;
  window.scrollTo({top:Math.max(0, target), behavior:"smooth"});
}

function showPhoneCaption(player, label, text){
  if(!player.box.isConnected) return;
  player.cap.hidden=!text;
  player.cap.querySelector("small").textContent=label||"";
  player.cap.querySelector("span").textContent=text||"";
}

/* While it reads, a small ad stays pinned to the top of the screen, just
   under the header when that's showing. */
function showPhoneTopAd(st){
  var html=adFrame(ADS.narration);
  if(!html) return;
  var bar=document.createElement("div");
  bar.className="narr-topad";
  bar.innerHTML=html;
  document.body.appendChild(bar);
  var timer=null;
  function place(){
    var top=document.querySelector(".top");
    bar.style.top=Math.max(0, top ? top.getBoundingClientRect().bottom : 0)+"px";
  }
  st.adBar=bar;
  st.onAdScroll=function(){ place(); clearTimeout(timer); timer=setTimeout(place, 300); };   // after the header slides
  window.addEventListener("scroll", st.onAdScroll, {passive:true});
  place();
}

function endPhoneNarration(st, message){
  var player=st.player;
  stopPhoneNarration();
  if(!player.box.isConnected) return;
  setPhoneFab(player, "idle");
  showPhoneCaption(player, "", message);
  if(message) setTimeout(function(){ if(!phoneNarr && player.cap.querySelector("span").textContent===message) showPhoneCaption(player, "", ""); }, 5000);
  warmPhoneReader(player);
}

function stopPhoneNarration(){
  var st=phoneNarr;
  if(!st) return;
  phoneNarr=null;
  st.stopped=true;
  clearTimeout(st.watchdog);
  st.workers.forEach(function(w){ w.terminate(); });
  ["touchstart","wheel","keydown"].forEach(function(ev){ window.removeEventListener(ev, st.onUser); });
  if(st.onAdScroll) window.removeEventListener("scroll", st.onAdScroll);
  if(st.adBar) st.adBar.remove();
  try{ window.speechSynthesis.cancel(); }catch(e){}
}

var EAGER_PAGES=3;

/* While someone reads, fetch the next chapter's page list in the
   background, so tapping Next doesn't wait on the scrape. It also fills
   the server's shared cache for everyone reading after them. */
/* comizy.io's image CDN rejects any request whose Referer isn't comizy.io
   itself, and a plain <img> load always sends our origin, so those go
   through our proxy, which sets the right Referer server-side. Every other
   source's CDN doesn't check, so they stay direct to spare our server. */
function pageSrc(src){
  var needsProxy=false;
  try{ needsProxy=/(^|\.)cmzcdn\.org$/i.test(new URL(src, location.href).hostname); }catch(e){}
  return needsProxy?via(src):src;
}

/* Pages are big (0.2-2 MB each) and phone data is the bottleneck, so the
   next chapter gets a head start: its page list is fetched shortly after
   this one opens, and once the reader is most of the way down, its first
   few pages are downloaded too. Tapping Next then shows them at once. */
function prefetchNextChapter(){
  var chapters=readerState.chapters, next=chapters&&chapters[readerState.index+1];
  if(!next) return;
  setTimeout(function(){ scrapeChapter(next.url); }, 1500);
  var pages=document.querySelectorAll("#rpages .rpage");
  var mark=pages[Math.floor(pages.length*0.6)];
  if(!mark || typeof IntersectionObserver==="undefined") return;
  var token=readerLoadToken;
  var io=new IntersectionObserver(function(entries){
    if(!entries.some(function(e){ return e.isIntersecting; })) return;
    io.disconnect();
    if(token!==readerLoadToken) return;
    scrapeChapter(next.url).then(function(res){
      if(!chapterLoaded(res) || token!==readerLoadToken) return;
      res.d.images.slice(0, EAGER_PAGES).forEach(function(src){
        var img=new Image();
        img.referrerPolicy="no-referrer";
        img.src=pageSrc(src);
      });
    });
  });
  io.observe(mark);
}

/* Image servers sometimes fail a page once and serve it moments later
   (MangaDex's servers answer 404 for a page they haven't cached yet). A
   failed page is asked for again twice before it counts as gone; then it
   fires "pagefailed". */
var PAGE_RETRY_DELAYS=[1500,4000];
function retryPage(img){
  var tries=0;
  img.addEventListener("error", function onError(){
    if(tries>=PAGE_RETRY_DELAYS.length){
      img.removeEventListener("error", onError);
      img.dispatchEvent(new Event("pagefailed"));
      return;
    }
    var src=img.getAttribute("src");
    setTimeout(function(){
      if(!img.isConnected) return;
      img.removeAttribute("src");
      img.setAttribute("src", src);
    }, PAGE_RETRY_DELAYS[tries++]);
  });
}

/* A site can hand back a full list of page URLs whose image server is
   down (kaliscan's CDN answering 522, say) — the scrape "worked", but
   every page is blank. If the very first page fails to load before any
   page has, treat that site as failed for this chapter and fall through
   to the next one, exactly as if the scrape itself had failed. */
function watchFirstPage(token, exclude){
  var imgs=document.querySelectorAll("#rpages img");
  if(!imgs.length) return;
  var anyLoaded=false;
  Array.prototype.forEach.call(imgs, function(img){
    img.addEventListener("load", function(){ anyLoaded=true; }, {once:true});
  });
  imgs[0].addEventListener("pagefailed", function(){
    if(anyLoaded || token!==readerLoadToken) return;
    var tried=(exclude||[]).concat([readerState.domain]);
    var current=readerState.chapters&&readerState.chapters[readerState.index];
    var untried=(readerState.alternates||[]).some(function(a){ return tried.indexOf(a.domain)<0; });
    if(current && untried){ readerView(current.url, tried); return; }
    // Every site tried and the pages still won't load: say so instead of
    // leaving broken images, and have the server re-check this title.
    var status=document.getElementById("rstatus");
    if(status) status.textContent="This chapter's pages won't load right now — try again later.";
    reportUnreadable(readerState.manga);
  }, {once:true});
}

/* Comments, scoped to the exact title + chapter someone just read (not
   the whole series) — "chapter they read" was the ask, and readerState
   already carries both the manga (set by wireReader) and the current
   chapter index. Reading them is public; posting reuses the same
   sign-in-required api() helper as tracking a title. */
function commentKey(){
  var m=readerState.manga, chapters=readerState.chapters, idx=readerState.index;
  if(!m || !chapters || idx<0 || !chapters[idx]) return null;
  return {title:m.id, chapter:String(chapters[idx].number)};
}

function runProbes(){
  var box=document.getElementById("probe");
  var tests=[
    {name:"AniList", why:"covers, titles, official links",
     run:function(){ return alSearch("tower of god").then(function(r){
       return r.length+" results"; }); }},
    {name:"Jikan", why:"backup source",
     run:function(){ return jikanSearch("tower of god").then(function(r){
       return r.length+" results"; }); }},
    {name:"MangaUpdates", why:"chapter counts for ongoing series",
     run:function(){ return muLatestRaw("Tower of God").then(function(r){
       return r? "chapter "+r.chapter : "no match"; }); }},
    {name:"TikTok oEmbed", why:"reads video captions",
     run:function(){ return fetch(via("https://www.tiktok.com/oembed?url="+
       encodeURIComponent("https://www.tiktok.com/@tiktok/video/6584647400055377158")))
       .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return "reachable"; }); }}
  ];
  box.innerHTML=tests.map(function(t,i){
    return '<div class="read no" id="p'+i+'"><span><span class="n">'+t.name+'</span><br>'+
      '<span class="t">'+t.why+'</span></span><span class="go" id="pr'+i+'">testing…</span></div>';
  }).join("");
  tests.forEach(function(t,i){
    t.run().then(function(msg){
      var el=document.getElementById("pr"+i);
      if(el){ el.textContent="OK · "+msg; el.style.color="var(--mint)"; }
    }).catch(function(e){
      var el=document.getElementById("pr"+i);
      if(el){ el.textContent="blocked"; el.style.color="var(--bad)"; }
      var row=document.getElementById("p"+i);
      if(row) row.title=String(e.message||e);
    });
  });
}
