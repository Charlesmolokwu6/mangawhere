services:
  - type: web
    name: mangawhere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "1800"
      # Optional — profile picture uploads (see README.md). Leaving these
      # unset is fine; avatars just stay the default initials circle.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
