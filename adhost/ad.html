<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Advertisement</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}body{display:flex;justify-content:center}</style>
<!--
  MangaWhere's ad frame. The main site (index.html, adFrame) embeds this
  page as ad.html?unit=300x250. It lives on its own origin
  (mangawhere-ads.onrender.com) so ad code gets working cookies and
  storage here, yet stays cross-origin to the site: it can't read the
  site's storage, cookies or sign-in.
  Only the units listed below can be shown; ?unit= just picks one.
  ?debug=1 prints what the network's script did after 8 seconds.
-->
</head>
<body>
<script>
// Units registered to this page's own site (mangawhere-ads.onrender.com) in
// Adsterra, since this is the page the ads actually load on. The first pair,
// registered to mangawhere.onrender.com, was e832e008.../f3f86d95....
var UNITS = {
  "300x250": {key: "9cf4c2d47b34c372fccb8f57da842958", width: 300, height: 250},
  "320x50":  {key: "0f8b7c3621aaafd11f5351c19639c035", width: 320, height: 50}
};
var params = new URLSearchParams(location.search);
var unit = UNITS[params.get("unit")];
var adErrors = [];
if (params.get("debug") === "1") {
  window.onerror = function (m) { adErrors.push(m); };
  setTimeout(function () {
    var d = document.createElement("pre");
    d.style.cssText = "position:absolute;top:0;left:0;margin:0;color:#fff;background:#000a;font:11px monospace;white-space:pre-wrap";
    var f = document.querySelector("iframe");
    d.textContent = "host ok unit:" + (params.get("unit") || "none") +
      " frames:" + document.querySelectorAll("iframe").length +
      (f ? " inner:" + f.offsetWidth + "x" + f.offsetHeight : "") +
      " errors:" + (adErrors.join(" | ") || "none");
    document.body.appendChild(d);
  }, 8000);
}
// Adsterra draws its ad in an iframe. If that iframe loads a second time,
// the ad navigated itself (a redirect ad); the advertiser's page usually
// refuses to be framed and shows as a grey sad-face box. Try one fresh ad,
// then give up and leave the frame empty.
if (unit && window.MutationObserver) {
  new MutationObserver(function (changes) {
    changes.forEach(function (c) {
      Array.prototype.forEach.call(c.addedNodes, function (n) {
        if (n.tagName !== "IFRAME") return;
        var loads = 0;
        n.addEventListener("load", function () {
          if (++loads < 2) return;
          // Tell the site first, so it knows this reload is ours (and
          // isn't the frame itself being redirected away).
          if (params.get("retry") !== "1") {
            parent.postMessage("mw-ad-retry", "*");
            params.set("retry", "1");
            location.replace(location.pathname + "?" + params.toString());
          } else {
            n.remove();
            parent.postMessage("mw-ad-empty", "*");
          }
        });
      });
    });
  }).observe(document.documentElement, {childList: true, subtree: true});
}
if (unit) {
  // Adsterra draws a 320x50 unit in a 300px-wide iframe, which crops the
  // edges off 320-wide banners. Give its frame the unit's full size.
  document.write("<style>iframe{width:" + unit.width + "px!important;height:" +
    unit.height + "px!important;max-width:100%}</style>");
  // Adsterra's banner code: atOptions, then its loader (which itself uses
  // document.write, so it has to be written in while the page parses).
  window.atOptions = {key: unit.key, format: "iframe", height: unit.height, width: unit.width, params: {}};
  document.write('<script src="https://www.highrevenueformat.com/' + unit.key + '/invoke.js"' +
    (params.get("debug") === "1" ? ' crossorigin="anonymous"' : "") + '><\/script>');
}
</script>
</body>
</html>
