/* ---- shareable links ----
   A link straight to one series. The point of this product is people
   passing titles to each other under recap videos, so a link that opens
   on the series rather than the home page is worth having.

   ?m=al-12345 rather than a path, because GitHub Pages serves static
   files and any invented path would 404. */
function shareUrl(m){
  return location.origin+location.pathname+"?m="+encodeURIComponent(m.id);
}

var SHARE_ICON_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
  '<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>'+
  '<polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>';
var CHECK_ICON_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
  '<polyline points="20 6 9 17 4 12"/></svg>';

function shareRow(m){
  return '<button class="sharebtn" id="sharebtn" aria-label="Share this" title="Share this" '+
    'style="flex:0 0 48px;width:48px;margin-top:0;display:flex;align-items:center;'+
    'justify-content:center;padding:0">'+SHARE_ICON_SVG+'</button>';
}

function wireShare(m){
  var b=document.getElementById("sharebtn");
  if(!b) return;
  b.onclick=function(){
    var url=shareUrl(m);
    // The native sheet where it exists — that's the WhatsApp and TikTok
    // path most people will use — and the clipboard everywhere else.
    if(navigator.share){
      navigator.share({title:m.title, text:"Where to read "+m.title, url:url})
        .catch(function(){});
      return;
    }
    var done=function(){
      b.innerHTML=CHECK_ICON_SVG;
      b.setAttribute("title","Link copied");
      setTimeout(function(){
        b.innerHTML=SHARE_ICON_SVG;
        b.setAttribute("title","Share this");
      },1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ fallbackCopy(url,done); });
    } else fallbackCopy(url,done);
  };
}

function fallbackCopy(text, done){
  var t=document.createElement("textarea");
  t.value=text; t.style.position="fixed"; t.style.left="-9999px";
  document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(t);
}

/* Opens the series named in the URL, so a shared link lands on the page

function openFromUrl(){

  }).catch(function(){

/* Ids carry their source: al- from AniList, mal- from MyAnimeList.

   The AniList lookup is wrapped in a Page query even though it returns one
   title, because alCall unwraps Page.media — asking for Media directly
   would return a shape it can't read. Jikan's single-title endpoint
   returns an object rather than an array, so that one needs its own
   fetch instead of jikanCall. */
function fetchById(id){
  if(/^al-/.test(id)){
    var n=parseInt(id.replace(/^al-/,""),10);
    if(!n) return Promise.resolve(null);
    return alCall("query{Page(perPage:1){media(id:"+n+",type:MANGA){"+AL_FIELDS+"}}}")
      .then(function(rows){ return (rows&&rows[0])||null; });
  }
  if(/^mal-/.test(id)){
    var k=parseInt(id.replace(/^mal-/,""),10);
    if(!k) return Promise.resolve(null);
    return fetch("https://api.jikan.moe/v4/manga/"+k)
      .then(function(r){
        if(!r.ok) throw new Error("Jikan "+r.status);
        return r.json();
      })
      .then(function(j){ return j&&j.data ? jikanShape(j.data) : null; });
  }
  return Promise.resolve(null);
}

/* ---- auth ----
   The token is the session. Kept in the same storage as the list so both
   survive a reload, and sent as a bearer header on anything account-shaped. */
var auth = { token:null, email:null, name:null, avatar_url:null };

function loadAuth(){
  try{
    var raw=store.get("mw.auth");
    if(raw) auth=JSON.parse(raw);
  }catch(e){ auth={token:null,email:null,name:null,avatar_url:null}; }
  return auth;
}
function saveAuth(a){
  auth=a||{token:null,email:null,name:null,avatar_url:null};
  if(auth.token) store.set("mw.auth", JSON.stringify(auth));
  else store.set("mw.auth","");
}
function signedIn(){ return !!(auth && auth.token); }

/* Every account-scoped call goes through here so the token is never
   forgotten and a dead session logs out cleanly instead of failing oddly. */
function api(path, opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  opts.headers["Content-Type"]="application/json";
  if(auth.token) opts.headers["Authorization"]="Bearer "+auth.token;
  return fetch(API_BASE+path, opts).then(function(r){
    if(r.status===401 && auth.token){ saveAuth(null); }
    return r.json();
  });
}

function authView(mode, thenTrack){
  stopRail();
  var login = mode==="login";
  var view=document.getElementById("app");
  view.innerHTML=
    '<button class="back" id="abk">← Back</button>'+
    '<h1>'+(login?"Welcome back":"Create your account")+'</h1>'+
    '<p class="sub">'+(login
      ? "Sign in to get to your list."
      : "So your list is yours — on any device, and still there if you lose this one.")+
    '</p>'+
    (thenTrack?'<div class="note"><p><strong>Nearly there</strong>'+
      'Sign up and we\'ll start tracking '+esc(thenTrack.title)+' straight away.</p></div>':"")+
    ((GOOGLE_CLIENT_ID||FACEBOOK_APP_ID)
      ? '<div class="oauth-buttons">'+
        (GOOGLE_CLIENT_ID?'<button type="button" class="oauth-btn" id="oauth-google">'+
          GOOGLE_ICON+'<span>Continue with Google</span></button>':"")+
        (FACEBOOK_APP_ID?'<button type="button" class="oauth-btn" id="oauth-facebook">'+
          FACEBOOK_ICON+'<span>Continue with Facebook</span></button>':"")+
        '</div><div class="oauth-divider"><span>or</span></div>'
      : "")+
    '<div class="form">'+
      '<label>Email<input id="au-email" type="email" autocomplete="email" '+
        'inputmode="email" placeholder="you@example.com"></label>'+
      '<label>Password<div class="pwwrap"><input id="au-pass" type="password" '+
        'autocomplete="'+(login?"current-password":"new-password")+'" '+
        'placeholder="'+(login?"Your password":"At least 8 characters")+'">'+
        '<button type="button" class="pwtoggle" id="au-pass-toggle" '+
        'aria-label="Show password">'+EYE_ICON+'</button></div></label>'+
      (login?"":'<label>Confirm password<div class="pwwrap"><input id="au-pass2" type="password" '+
        'autocomplete="new-password" placeholder="Type it again">'+
        '<button type="button" class="pwtoggle" id="au-pass2-toggle" '+
        'aria-label="Show password">'+EYE_ICON+'</button></div></label>')+
      // Honeypot. Hidden from people, filled in by scripts that fill
      // every field they find. Not display:none — some bots skip those.
      '<div class="hp" aria-hidden="true">'+
        '<label>Website<input id="au-hp" type="text" tabindex="-1" '+
        'autocomplete="off"></label></div>'+
      (login?"":(TURNSTILE_SITE_KEY
        ? '<div id="cf-turnstile"></div>'
        : '<label>Type the characters'+
          '<div class="cap"><div class="capimg" id="capimg">'+
            '<span class="caploading">loading…</span></div>'+
            '<button type="button" class="caprefresh" id="caprefresh" '+
            'title="Show a different one" aria-label="Show a different one">↻</button>'+
          '</div>'+
          '<input id="au-cap" type="text" autocomplete="off" autocapitalize="characters" '+
          'spellcheck="false" maxlength="5" placeholder="5 characters"></label>'))+
      '<button class="primary" id="au-go">'+(login?"Sign in":"Create account")+'</button>'+
      (login?'<p class="forgot" id="au-forgot" hidden><button type="button" class="linkish" id="au-forgot-btn">'+
        'Forgot password?</button></p>':"")+
      '<p class="err" id="au-err"></p>'+
    '</div>'+
    '<p class="hint swap">'+(login
      ? 'New here? <button class="linkish" id="au-swap">Create an account</button>'
      : 'Already have one? <button class="linkish" id="au-swap">Sign in</button>')+'</p>';

  document.getElementById("abk").onclick=function(){ setTab("home"); };
  document.getElementById("au-swap").onclick=function(){
    authView(login?"signup":"login", thenTrack);
  };
  if(login){
    // Only offered once the server can actually send the email.
    getServerConfig().then(function(cfg){
      var row=document.getElementById("au-forgot");
      if(row && cfg.password_reset) row.hidden=false;
    });
    document.getElementById("au-forgot-btn").onclick=function(){
      forgotView(document.getElementById("au-email").value.trim());
    };
  }

  /* Lets someone check what they actually typed before submitting, same
     as every password manager and modern sign-up form does. */
  function wirePasswordToggle(inputId, buttonId){
    var input=document.getElementById(inputId), btn=document.getElementById(buttonId);
    if(!input||!btn) return;
    btn.onclick=function(){
      var showing=input.type==="text";
      input.type=showing?"password":"text";
      btn.innerHTML=showing?EYE_ICON:EYE_OFF_ICON;
      btn.setAttribute("aria-label",showing?"Show password":"Hide password");
    };
  }
  wirePasswordToggle("au-pass","au-pass-toggle");
  if(!login) wirePasswordToggle("au-pass2","au-pass2-toggle");

  var go=document.getElementById("au-go");
  var err=document.getElementById("au-err");
  var openedAt=Date.now();   // how long the form took, to spot scripts
  var capId=null;
  var turnstileWidgetId=null;

  /* The custom captcha's script tag loads once, up front (see near PROXY),
     but the widget div it renders into is recreated fresh every time this
     form is. Cloudflare's implicit auto-render only scans the page once on
     load, so it never sees a div added afterward — this renders it
     explicitly instead, retrying briefly if the script itself is still
     loading. */
  function renderTurnstile(retries){
    if(!TURNSTILE_SITE_KEY || login) return;
    var el=document.getElementById("cf-turnstile");
    if(!el) return;
    if(typeof turnstile==="undefined" || !turnstile.render){
      if(retries===undefined) retries=20;
      if(retries<=0){ el.textContent="Couldn't load the verification check — reload the page."; return; }
      setTimeout(function(){ renderTurnstile(retries-1); }, 250);
      return;
    }
    el.innerHTML="";
    turnstileWidgetId=turnstile.render(el, {sitekey:TURNSTILE_SITE_KEY});
  }
  renderTurnstile();

  /* The answer stays on the server; we only ever hold the id. */
  function loadCaptcha(){
    if(login || TURNSTILE_SITE_KEY) return;
    var box=document.getElementById("capimg");
    if(!box) return;
    box.innerHTML='<span class="caploading">loading…</span>';
    fetch(API_BASE+"/api/captcha")
      .then(function(r){ return r.json(); })
      .then(function(d){
        capId=d.id;
        box.innerHTML=d.svg;
        var f=document.getElementById("au-cap");
        if(f) f.value="";
      })
      .catch(function(){
        box.innerHTML='<span class="caploading">couldn\'t load — tap ↻</span>';
      });
  }
  loadCaptcha();
  var cr=document.getElementById("caprefresh");
  if(cr) cr.onclick=loadCaptcha;

  /* Shared by the email/password form and both OAuth buttons -- whichever
     path got a session token, what happens next is identical. */
  function finishAuth(d){
    saveAuth({token:d.token, email:d.email, name:d.name, avatar_url:d.avatar_url||null});
    if(pushState.endpoint){
      api("/api/subscribe",{method:"POST",body:JSON.stringify({
        endpoint:pushState.endpoint,
        keys:{p256dh:pushState.p256dh||"",auth:pushState.auth||""}
      })}).catch(function(){});
    }
    return pullServerList().then(function(){
      if(thenTrack){
        if(!inList(thenTrack.id)){
          addToList(thenTrack, thenTrack.chapters||null);
          syncWatch(thenTrack, thenTrack.chapters||null);
        }
        updateBadge();
        showDetail(thenTrack, null);
      } else {
        setTab("list");
      }
    });
  }

  if(GOOGLE_CLIENT_ID){
    var gbtn=document.getElementById("oauth-google");
    if(gbtn) gbtn.onclick=function(){
      if(typeof google==="undefined" || !google.accounts){
        err.textContent="Google sign-in is still loading — try again in a moment."; return;
      }
      gbtn.disabled=true;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: function(resp){
          api("/api/oauth/google",{method:"POST",body:JSON.stringify({
            id_token:resp.credential, endpoint:pushState.endpoint||undefined
          })}).then(function(d){
            if(d.error){ err.textContent=d.error; gbtn.disabled=false; return; }
            return finishAuth(d);
          }).catch(function(e){
            err.textContent="Couldn't reach the server — "+e.message;
            gbtn.disabled=false;
          });
        }
      });
      google.accounts.id.prompt(function(notification){
        if(notification.isNotDisplayed && notification.isNotDisplayed()) gbtn.disabled=false;
        if(notification.isSkippedMoment && notification.isSkippedMoment()) gbtn.disabled=false;
      });
    };
  }
  if(FACEBOOK_APP_ID){
    var fbtn=document.getElementById("oauth-facebook");
    if(fbtn) fbtn.onclick=function(){
      if(typeof FB==="undefined"){
        err.textContent="Facebook sign-in is still loading — try again in a moment."; return;
      }
      fbtn.disabled=true;
      FB.login(function(resp){
        if(!resp.authResponse){
          err.textContent="Facebook sign-in was cancelled."; fbtn.disabled=false; return;
        }
        api("/api/oauth/facebook",{method:"POST",body:JSON.stringify({
          access_token:resp.authResponse.accessToken, endpoint:pushState.endpoint||undefined
        })}).then(function(d){
          if(d.error){ err.textContent=d.error; fbtn.disabled=false; return; }
          return finishAuth(d);
        }).catch(function(e){
          err.textContent="Couldn't reach the server — "+e.message;
          fbtn.disabled=false;
        });
      },{scope:"email"});
    };
  }

  function submit(){
    var email=document.getElementById("au-email").value.trim();
    var pass=document.getElementById("au-pass").value;
    var p2el=document.getElementById("au-pass2");
    var hp=document.getElementById("au-hp");

    if(!email || !pass){ err.textContent="Fill in both fields."; return; }
    if(!login && pass.length<8){
      err.textContent="Password must be at least 8 characters."; return;
    }
    if(!login && p2el && pass!==p2el.value){
      err.textContent="Passwords don't match."; return;
    }
    var capEl=document.getElementById("au-cap");
    if(!login && capEl && !TURNSTILE_SITE_KEY && !capEl.value.trim()){
      err.textContent="Type the characters shown in the picture."; return;
    }
    var turnstileToken=(!login && TURNSTILE_SITE_KEY && typeof turnstile!=="undefined")
      ? turnstile.getResponse(turnstileWidgetId) : undefined;
    if(!login && TURNSTILE_SITE_KEY && !turnstileToken){
      err.textContent="Complete the verification check."; return;
    }
    go.disabled=true; go.textContent=login?"Signing in…":"Creating…";
    err.textContent="";

    api(login?"/api/login":"/api/register",{
      method:"POST",
      body:JSON.stringify({email:email, password:pass,
        endpoint:pushState.endpoint||undefined,
        website:(hp?hp.value:""),
        elapsed:(Date.now()-openedAt)/1000,
        captcha_id:capId||undefined,
        captcha:(capEl?capEl.value.trim():undefined),
        turnstile_token:turnstileToken})
    }).then(function(d){
      if(d.error){
        err.textContent=d.error;
        // A used challenge is gone, so always issue a fresh one rather than
        // leaving them retrying with a token/picture that can no longer pass.
        if(d.captcha_failed || !login) loadCaptcha();
        if(!login && TURNSTILE_SITE_KEY && typeof turnstile!=="undefined" && turnstileWidgetId!=null)
          turnstile.reset(turnstileWidgetId);
        go.disabled=false; go.textContent=login?"Sign in":"Create account";
        return;
      }
      return finishAuth(d);
    }).catch(function(e){
      err.textContent="Couldn't reach the server — "+e.message;
      go.disabled=false; go.textContent=login?"Sign in":"Create account";
    });
  }

  go.onclick=submit;
  ["au-email","au-pass","au-pass2"].forEach(function(id){
    if(!document.getElementById(id)) return;
    document.getElementById(id).onkeydown=function(e){
      if(e.key==="Enter") submit();
    };
  });
  window.scrollTo(0,0);
}

/* A reset link lands here as #reset=<token>. The token is taken out of the
   address bar straight away, so it isn't left in history or shared by
   accident. */
function openResetFromUrl(){
  var m=/^#reset=([A-Za-z0-9_-]{20,})$/.exec(location.hash||"");
  if(!m) return false;
  try{ history.replaceState(null, "", location.pathname+location.search); }catch(e){}
  resetView(m[1]);
  return true;
}

/* Speaks about this device only, and offers the fix when it can. */
function showNotifState(){
  var st=document.getElementById("nstate"), sub=document.getElementById("nsub"),
      btn=document.getElementById("nbtn");
  if(!st) return;

  var sup=pushSupport();
  var perm=(typeof Notification!=="undefined") ? Notification.permission : "unsupported";

  if(perm==="granted" && pushState.endpoint){
    st.textContent="Notifications are on";
    sub.textContent="You'll hear about new chapters on this device.";
    btn.hidden=true;
    return;
  }
  if(perm==="denied"){
    st.textContent="Notifications are blocked";
    sub.textContent="Tap the padlock in the address bar to allow them.";
    btn.hidden=true;
    return;
  }
  if(sup.reason==="ios:add-to-home-screen"){
    st.textContent="Notifications need the home screen";
    sub.textContent="Tap Share, then Add to Home Screen, and open it from there.";
    btn.hidden=true;
    return;
  }
  if(!sup.ok && sup.reason!=="no backend configured"){
    st.textContent="Notifications unavailable";
    sub.textContent=sup.reason;
    btn.hidden=true;
    return;
  }
  st.textContent="Notifications are off";
  sub.textContent="Turn them on to hear when a chapter drops.";
  btn.hidden=false;
  btn.onclick=function(){
    btn.disabled=true; btn.textContent="…";
    enablePush().then(function(r){
      btn.disabled=false; btn.textContent="Turn on";
      showNotifState();
      if(!r.ok) sub.textContent="Couldn't turn them on — "+r.reason;
    });
  };
}

    // A device count is a number nobody can act on. Whether alerts reach

/* Custom-styled "Change photo" button driving a hidden file input —
   multipart, so it bypasses api()'s JSON content-type and sets the
   Authorization header itself. */
function wireAvatarUpload(){
  var btn=document.getElementById("ac-avatarbtn");
  var file=document.getElementById("ac-avatarfile");
  var err=document.getElementById("ac-avatarerr");
  if(!btn || !file) return;

  btn.onclick=function(){ file.click(); };
  file.onchange=function(){
    var f=file.files && file.files[0];
    if(!f) return;
    err.textContent="";
    btn.disabled=true; btn.textContent="Uploading…";

    var fd=new FormData();
    fd.append("file", f);
    fetch(API_BASE+"/api/avatar", {
      method:"POST",
      headers: auth.token ? {"Authorization":"Bearer "+auth.token} : {},
      body: fd
    }).then(function(r){
      return r.json().then(function(d){ return {ok:r.ok, d:d}; });
    }).then(function(res){
      btn.disabled=false; btn.textContent="Change photo";
      file.value="";
      if(!res.ok){
        err.textContent=(res.d && res.d.detail) || "Couldn't upload that — try again.";
        return;
      }
      auth.avatar_url=res.d.avatar_url;
      saveAuth(auth);
      var box=document.getElementById("ac-avatar");
      if(box) box.innerHTML=avatarHtml(auth.name, auth.email, auth.avatar_url, 44);
    }).catch(function(){
      btn.disabled=false; btn.textContent="Change photo";
      err.textContent="Couldn't upload that — try again.";
    });
  };
}

/* After linking, the server knows about titles this browser doesn't. */
function pullServerList(){
  if(!API_BASE || !signedIn()) return Promise.resolve();
  return api("/api/list")
    .then(function(d){
      var local=getList();
      var have={};
      local.forEach(function(x){ have[String(x.id)]=true; });
      (d.titles||[]).forEach(function(t){
        if(have[String(t.key)]) return;
        local.push({id:t.key, title:t.name, cover:t.cover||"", kind:t.kind||"",
          status:"", country:"", links:[], seen:t.seen, latest:t.latest,
          added:Date.now()});
      });
      saveList(local);
    })
    .catch(function(){});
}

function listView(){
  stopRail();
  var view=document.getElementById("app");

  /* Signed out is checked before anything else. Tracking needs an account,
     so a leftover local list from before that rule can't be what we show —
     it would contradict the gate and leave people looking at a list they
     have no account for. */
  if(!signedIn()){
    view.innerHTML='<button class="back" id="lb">← Back</button>'+
      '<div class="pitch">'+
        '<div class="picon">☰</div>'+
        '<h1>Start your list</h1>'+
        '<p class="sub">Create an account and Manga Where keeps track of every '+
        'series you follow.</p>'+
        '<ul class="pben">'+
          '<li>A notification the moment a new chapter is out</li>'+
          '<li>Your list on your phone and your computer</li>'+
          '<li>See at a glance what you haven\'t read</li>'+
        '</ul>'+
        '<button class="primary" id="lsignup">Create a free account</button>'+
        '<p class="hint">Already have one? '+
          '<button class="linkish" id="llogin">Sign in</button></p>'+
      '</div>';
    document.getElementById("lb").onclick=function(){ setTab("home"); };
    document.getElementById("lsignup").onclick=function(){ authView("signup"); };
    document.getElementById("llogin").onclick=function(){ authView("login"); };
    window.scrollTo(0,0);
    return;
  }

  var l=getList();
  if(!l.length){
    view.innerHTML='<button class="back" id="lb">← Back</button>'+
      '<div class="pitch">'+
        '<div class="picon">☰</div>'+
        '<h1>Your list is empty</h1>'+
        '<p class="sub">Find a manga and tap "Track this". We\'ll tell you '+
        'the moment a new chapter is out.</p>'+
        '<button class="primary" id="lfind">Find something to read</button>'+
      '</div>';
    document.getElementById("lb").onclick=function(){ setTab("home"); };
    document.getElementById("lfind").onclick=function(){ setTab("search"); };
    window.scrollTo(0,0);
    return;
  }

  view.innerHTML='<button class="back" id="lb">← Back</button>'+
    '<h1>Your list</h1>'+
    '<p class="sub">'+l.length+' title'+(l.length===1?"":"s")+'. '+
    (store.persistent
      ? 'Saved on this device.'
      : 'Not saved — this browser is blocking storage, so the list resets on reload.')+
    '</p>'+
    '<div class="listrows" id="listrows">'+
      l.map(function(x,i){ return listRow(x,i); }).join("")+
    '</div>';

  document.getElementById("lb").onclick=function(){ setTab("home"); };
  wireListRows();
  refreshList(l);
  window.scrollTo(0,0);
}

function listRow(x,i){
  var unread = x.latest && x.seen && x.latest>x.seen;
  return '<div class="lrow'+(unread?" unread":"")+'" data-id="'+esc(String(x.id))+'">'+
    (x.cover?'<img alt="" src="'+esc(x.cover)+'">':'<div class="ph"></div>')+
    '<div class="linfo">'+
      '<h4>'+esc(x.title)+'</h4>'+
      '<p class="lmeta" id="lm-'+i+'">'+
        (x.latest? ("chapter "+x.latest) : "checking…")+
        (x.seen&&x.latest&&x.latest>x.seen
          ? ' · <span class="newtag">'+(x.latest-x.seen)+' new</span>' : "")+
      '</p>'+
    '</div>'+
    '<div class="lacts">'+
      (unread?'<button class="lread" data-act="read">Mark read</button>':"")+
      '<button class="lx" data-act="remove" aria-label="Remove">×</button>'+
    '</div></div>';
}

function wireListRows(){
  var rows=document.querySelectorAll(".lrow");
  for(var i=0;i<rows.length;i++){
    (function(row){
      var id=row.dataset.id;
      row.querySelectorAll("button").forEach(function(b){
        b.onclick=function(e){
          e.stopPropagation();
          if(b.dataset.act==="remove") removeFromList(id);
          else markRead(id);
          listView();
        };
      });
      row.onclick=function(){
        var item=getList().filter(function(x){ return String(x.id)===String(id); })[0];
        if(item) showDetail(item, null);
      };
    })(rows[i]);
  }
}

/* This is the monitoring. No server involved — every time you open the
   list we re-check each title and compare against the number you last
   saw. Real push notifications need the backend; this needs nothing. */
function refreshList(l){
  l.forEach(function(x,i){
    latestFor(x).then(function(n){
      if(!n) return;
      var cur=getList();
      var changed=false;
      cur.forEach(function(y){
        if(String(y.id)===String(x.id) && y.latest!==n){ y.latest=n; changed=true; }
      });
      if(changed) saveList(cur);
      var el=document.getElementById("lm-"+i);
      if(el){
        var item=cur.filter(function(y){ return String(y.id)===String(x.id); })[0]||{};
        var diff=(item.seen&&item.latest&&item.latest>item.seen)?(item.latest-item.seen):0;
        el.innerHTML="chapter "+n+(diff?' · <span class="newtag">'+diff+' new</span>':"");
        if(diff){
          var row=el.closest(".lrow");
          if(row && !row.classList.contains("unread")){ row.classList.add("unread"); }
        }
      }
      updateBadge();
    });
  });
}

/* One number, best source first: the publisher if we can read it,
   otherwise the release tracker. */
function latestFor(x){
  return webtoonLatest(x.links).then(function(pub){
    if(pub && pub.chapter) return pub.chapter;
    return muLatest(x.title).then(function(hit){
      return (hit && hit.chapter) ? hit.chapter : null;
    });
  }).catch(function(){ return null; });
}

/* ---- tab navigation ----
   One place that decides what's on screen, so the highlighted tab and the
   view can never disagree. Deep views like a series page keep the tab they
   were opened from lit, the way a native app does. */
var curTab="home";

function setTab(tab){
  curTab=tab;
  var els=document.querySelectorAll(".tab");
  for(var i=0;i<els.length;i++)
    els[i].className = els[i].dataset.tab===tab ? "tab on" : "tab";

  if(tab==="home")    homeView();
  if(tab==="list")    listView();
  if(tab==="account") accountView();
  if(tab==="search"){
    homeView();
    // Jump straight to the thing they tapped for.
    setTimeout(function(){
      var i=document.getElementById("q");
      if(i){ i.focus(); i.scrollIntoView({block:"center",behavior:"smooth"}); }
    },90);
  }
  updateBadge();
}

/* Fifteen genre buttons above the covers pushed the actual content off
   the screen. They live behind a toggle now, so the page opens on comics. */
function wireGenreToggle(){
  var t=document.getElementById("genretog"), row=document.getElementById("genrerow");
  if(!t||!row) return;
  // Once a genre is chosen, leave the row open — they'll want to change or
  // clear it, and hiding it makes the selection feel stuck.
  row.hidden = !curGenre;
  t.onclick=function(){ row.hidden=!row.hidden; };
}

(function wireTabs(){
  var els=document.querySelectorAll(".tab");
  for(var i=0;i<els.length;i++)
    els[i].onclick=(function(t){ return function(){ setTab(t); }; })(els[i].dataset.tab);
})();

/* ---- install prompt ----
   Chrome fires beforeinstallprompt when the app qualifies; we hold onto it
   and show our own bar instead, because the browser's default is easy to
   miss. iOS never fires it — Apple requires Share > Add to Home Screen by
   hand — so those users get told that instead. */
var deferredInstall=null;

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall=e;
  if(!store.get("mw.noinstall")) showInstallBar(false);
});

function showInstallBar(iosMode){
  var bar=document.getElementById("installbar");
  if(!bar || isStandalone()) return;
  if(iosMode){
    bar.querySelector("span").textContent="Tap Share, then Add to Home Screen";
    document.getElementById("installgo").hidden=true;
  }
  bar.hidden=false;
}

document.getElementById("installgo").onclick=function(){
  var bar=document.getElementById("installbar");
  if(!deferredInstall){
    // No stored prompt: tell them where the menu item is instead of
    // doing nothing, which is what a dead button feels like.
    bar.querySelector("span").textContent = isIOS()
      ? "Tap Share, then Add to Home Screen"
      : "Open your browser menu (⋮) and choose Install app";
    document.getElementById("installgo").hidden=true;
    return;
  }
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(res){
    if(res && res.outcome==="accepted") bar.hidden=true;
    else bar.hidden=true;   // declined — don't nag
  }).catch(function(){ bar.hidden=true; })
    .finally(function(){ deferredInstall=null; });
};
document.getElementById("installno").onclick=function(){
  document.getElementById("installbar").hidden=true;
  store.set("mw.noinstall","1");   // asked once, that's enough
};

// iOS gets the manual instruction, and it matters more there: Apple only
// allows push notifications once the app is on the home screen.
if(isIOS() && !isStandalone() && !store.get("mw.noinstall")){
  setTimeout(function(){ showInstallBar(true); }, 3000);
}
document.getElementById("home").onclick=function(){homeView();};
// A reset link opened in a tab that already has the site open only
// changes the #fragment, which doesn't reload the page.
window.addEventListener("hashchange", openResetFromUrl);
loadAuth();
if(!openResetFromUrl()){
  homeView();
  openFromUrl();
}
updateBadge();
</script>
