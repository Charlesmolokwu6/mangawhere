services:
  - type: web
    name: mangawhere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "1800"
